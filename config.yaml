# Loop settings (FLOW-05, FLOW-13). Schema: README.md.

# Unattended runs do no work until the human confirms the priority order in
# queue/*.yaml (set by the workflow-human skill).
priority_confirmed: true

# Steps one daily run may take. Starts small; calibrate against /usage.
run_budget:
  steps: 8

limits:
  in_progress: 5           # features in progress at once (FLOW-05)
  alters_relationships: 1  # of those, past Design with alters_relationships: true

lease_minutes: 120         # a claimed step's lease; an expired lease may be reclaimed (FLOW-04)
runaway_factor: 2          # a feature escalates to the human at this multiple of its step estimate (FLOW-13)
