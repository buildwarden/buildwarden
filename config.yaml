# Loop settings (FLOW-05, FLOW-13). Schema: README.md.

# Unattended runs do no work until the human confirms the priority order in
# queue/*.yaml (set by the workflow-human skill).
priority_confirmed: true

# The repository whose gates wf runs and whose area map areas.yaml is
# (FLOW-05, PROFILE-01).
repository: buildwarden/buildwarden

# Every repository an item may name, with its trunk; wf reads a trunk here
# only (LOOP-01, PROFILE-01, loop-repository Decisions 2-3). An entry gains its
# profile only once the pull request that adopts the repository has merged, on
# Jeff's word. Written by loop-repository's tasks 14a and 14b (Jeff, 2026-11-20).
repositories:
  - name: buildwarden/buildwarden
    trunk: main
    profile: docs/development/loop-profile.yaml
  - name: buildwarden/buildwarden-specs  # not adopted: no profile
    trunk: main

# Steps one daily run may take; calibrate against /usage. Doubled from 12 on
# 2026-11-12 (Jeff): weekly usage was very low.
run_budget:
  steps: 24

# Steps one scheduled native session may take (FLOW-13), so native and
# integration testing never compete with the cloud loop. Unset falls back to
# run_budget. Starts at 8; calibrate against /usage.
native_budget:
  steps: 8

limits:
  in_progress: 5           # features in progress at once, process items not counted (FLOW-05); 5 when unset
  alters_relationships: 3  # FLOW-05: features holding an alters_relationships slot; 1 when unset. Raised from 1 for the componentization program (FLOW-20, a5), 2026-11-12
  waiting_on_human: 8      # FLOW-05: items in progress waiting on the human at which no queued feature starts; 8 when unset

lease_minutes: 120         # a claimed step's lease; an expired lease may be reclaimed (FLOW-04)
runaway_factor: 2          # a feature escalates to the human at this multiple of its step estimate (FLOW-13)
