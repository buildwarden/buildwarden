# Native machines (FLOW-04, FLOW-09): which host names each machine's scheduled
# native session serves. Each host name has exactly one machine, so moving a
# capability between machines is an edit here, not a code change. Read by
# `wf gate` and `wf validate`; the procedure is the workflow-native skill.
#
# Host names: <os>-<driver> is specific to that platform (macos-vz,
# windows-hyperv); <capability>-any can run on any native host that has it and
# goes to the always-on machine.
machines:
  - name: macbook
    hosts: [macos-vz, macos-qemu, macos-finch, qemu-any]
    note: >-
      Jeff's MacBook Pro (arm64). Asleep or away at times; launchd runs a missed slot on wake.
      Holds qemu-any because the qemu driver runs only on aarch64 hosts (2026-10-30).
  - name: windows-desktop
    hosts: [windows-hyperv, container-any]
    note: Always-on Windows desktop. Takes any-OS native work that runs here (a container runtime).
