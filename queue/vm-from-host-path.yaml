alters_relationships: null
source: Filed on Jeff's word, 2026-11-17, in workdir-in-context's design review (a2 (a)). Security fix, exempt from the FLOW-20 freeze. Under qemu and firecracker, FROM /abs/x or FROM ./x is used as the build VM's base disk as it is (linuxguest.ResolveImage), so a build context names a host file to boot; qemu opens it as qcow2 (-F qcow2), whose header can name a backing file of its own anywhere on the host; firecracker's EnsureRaw path not yet traced. And linuxguest.ContainerfileImage returns empty on any translation error, so with --script a FROM that does not parse boots the driver's default image with no message (an unnamed fallback, GLOBAL-11). Both are older than workdir-in-context and change documented VM behaviour. Needs its own trace of the qcow2 backing chain and of EnsureRaw, and native validation on qemu-any. See docs/design/workdir-in-context.md, Questions a2.
