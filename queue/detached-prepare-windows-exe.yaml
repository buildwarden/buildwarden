feature: detached-prepare-windows-exe
title: On Windows a warden whose file has no .exe ending (make build's dist/warden) cannot start the background image prepare, and says nothing; with a warden.exe beside it, that file is run instead
priority: 3
follows: project-config-trust
status: in_progress
round: feature
phase: 4
design: docs/design/detached-prepare-windows-exe.md
branch: feat/detached-prepare-windows-exe
areas:
  - driver-core
  - driver/hyperv
  - driver/qemu
  - book
  - designs
declared: 0c1cad5
alters_relationships: false
design_review: required
source: 'Found by host:windows-hyperv/20261116T051002Z (unattended, windows-desktop) while validating project-config-trust''s tier-2 gap project-config-trust-hyperv; main 623131a has it too, so it is filed as the item''s follow-up (FLOW-09). driver.StartDetached runs exec.Command(os.Executable(), ...). On Windows os/exec resolves a path with no extension only by adding the PATHEXT endings, so for dist/warden (what make build writes on Windows: go build -o dist/warden) it looks for dist/warden.exe. With no such file Start fails; driver/hyperv/freshness.go (and driver/qemu) drop the error, so the build prints no ''refreshing it in the background'' line, prepare.log is left truncated to 0 bytes and no prepare runs: a prepared base then ages until the build is refused at image_min_grace. With a warden.exe beside it, that other file is started: on this host a stale dist/warden.exe of 2026-11-04 ran the prepare for main''s build of 2026-11-16. Evidence, native/windows-hyperv/2026-11-15/: main-623131a-hyperv-refresh-due.log (stale warden.exe beside: line printed, prepare ran, from the old file), main-623131a-hyperv-refresh-due-no-exe-beside.log (it moved aside: no line, prepare.log 0 bytes, no process), branch-3733c4b-hyperv-build.log (the same on the branch, no warden.exe in its dist), branch-3733c4b-hyperv-refresh-due-exe.log (run as warden.exe: works). A released warden.exe is not affected. To settle in design: start the file os.Executable names without the lookup, report a failed start, and whether make build should write dist/warden.exe on Windows.'
