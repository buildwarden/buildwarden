questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: 'make build on Windows: what it writes. With the fix the extension no longer matters to warden; the native allowlist (.claude/, a process item only) matches dist/warden and not dist/warden.exe.'
    options:
      - keep dist/warden on every OS
      - write dist/warden.exe when the target OS is Windows, and file a process item for the native allowlist
      - write both
    recommended: keep dist/warden on every OS
    answer: (a) as drafted (Jeff, 2026-11-17)
  - id: a2
    kind: assumed
    status: confirmed
    question: A due background refresh that cannot start (today dropped silently).
    options:
      - print one line naming the failure and the warden image prepare command that refreshes by hand, write the error to the log, and go on with the build on the current base
      - fail the build with that fix
      - stay silent, as today
    recommended: print one line naming the failure and the warden image prepare command that refreshes by hand, write the error to the log, and go on with the build on the current base
    answer: (a) as drafted (Jeff, 2026-11-17)
