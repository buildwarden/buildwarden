    status: open
    question: 'vm mode (Decision 4): the init keeps interface selection, link-up, upstream setup, IPv6 off, ip_forward and every (interface-keyed) iptables rule and passes -build-if; on a valid claim and before replying the relay refuses a link overlapping its other interfaces, flushes the build interface''s IPv4 addresses, adds relay/len through netlink and uses it as its self address; without -build-if it applies the init''s rule, so old qemu and Firecracker relay initramfs need no rebuild.'
