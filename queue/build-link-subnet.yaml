questions:
  - id: a1
    kind: assumed
    status: open
    question: The relay-to-build link's range (Decision 1). Every VM driver uses it; the relay routes any upstream address inside it to the build VM.
    options:
      - RFC 6598 top /30, 100.127.255.252/30 (relay .253, build VM .254)
      - RFC 6598 next to BuildWarden's block, 100.64.86.0/30
      - link-local 169.254.87.0/30
      - keep 10.0.0.0/30 and policy-route the relay's upstream sockets
    recommended: RFC 6598 top /30, 100.127.255.252/30 (relay .253, build VM .254)
  - id: a2
    kind: assumed
    status: open
    question: Where the address is defined (Decision 2).
    options:
      - one embedded file driver/buildlink/link.env, read by Go via embed and copied into every initramfs for the inits to source, plus a tier-0 stray-literal test
      - a Go constant plus a drift test over the shell copies
      - the kernel command line (impossible for Hyper-V's baked UKI)
    recommended: one embedded file driver/buildlink/link.env, read by Go via embed and copied into every initramfs for the inits to source, plus a tier-0 stray-literal test
  - id: a3
    kind: assumed
    status: open
    question: 'Assets baked with the old link: relay and build initramfs, the Hyper-V relay boot VHDX, prepared vz images (Decision 3).'
    options:
      - a link record beside each baked asset; build and doctor refuse a missing or different one with the rebuild/re-prepare fix
      - document the rebuild only
      - the relay answers on both addresses for a transition
    recommended: a link record beside each baked asset; build and doctor refuse a missing or different one with the rebuild/re-prepare fix
  - id: a4
    kind: assumed
    status: open
    question: 'PR #90''s firecracker resolver refusal and the CI DNS workaround (Decision 4).'
    options:
      - keep the exclusion retargeted at the new link; drop the firecracker.yml DNS workaround so CI exercises the VPC-resolver case
      - remove the exclusion, since the new range is out of common use
      - keep both the exclusion and the workaround
    recommended: keep the exclusion retargeted at the new link; drop the firecracker.yml DNS workaround so CI exercises the VPC-resolver case
  - id: a5
    kind: assumed
    status: open
    question: 'macos-qemu (Windows guest on qemu) as tracked rather than blocking: driver/qemu does not change, its shared pieces are validated on windows-hyperv and qemu-any, and qemu Windows builds already fail on main (backlog qemu-windows-guest-package).'
    options:
      - tracked (backlog build-link-subnet-qemu-windows)
      - 'blocking, criterion: gets no further than on main'
      - blocking, waiting on the qemu Windows fix
    recommended: tracked (backlog build-link-subnet-qemu-windows)
  - id: a6
    kind: assumed
    status: open
    question: A configuration knob for the link (Decision 5, ORCH-03).
    options:
      - fixed link, no warden.toml key or flag
      - a config key with a per-value asset record
    recommended: fixed link, no warden.toml key or flag
  - id: a7
    kind: assumed
    status: open
    question: 'seams [] and alters_relationships false: initialize --gateway/--ip keeps its contract (EXEC-04), claim/collector/guest API unchanged, no ledger/schema/environment-record format names the address (RELAY-05), no BOOT invariant, mapping row or deviation changes (BOOT-07).'
    options:
      - 'as stated: no seam, alters_relationships false'
      - conservatively declare executor-initialize and alters_relationships true
    recommended: 'as stated: no seam, alters_relationships false'
  - id: a8
    kind: assumed
    status: open
    question: The vz host-mode relay blocks upstream dials into its whole --subnet, not only the gateway, since an RFC 6598 guest address is no longer covered by the SSRF filter's RFC 1918 block (a small relay change; Security note).
    options:
      - block the subnet
      - leave the relay alone
    recommended: block the subnet
