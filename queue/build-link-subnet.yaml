feature: build-link-subnet
title: Move every VM driver's relay-to-build link off 10.0.0.0/30
priority: 18
status: in_progress
round: feature
phase: 6
design: docs/design/build-link-subnet.md
branch: feat/build-link-subnet
alters_relationships: true
design_review: required
source: 'firecracker-driver PR #90, CI tier 2 first run (2026-11-02): the runner''s VPC resolver 10.0.0.2 sits inside the relay''s build link 10.0.0.0/30 (relay 10.0.0.1, guest 10.0.0.2) shared by linuxguest (qemu, firecracker), winguest (qemu, hyperv), vz and tools/relay-vm/init, so the relay routes it to the build VM. PR #90 adds a firecracker preflight/doctor refusal; this moves the link for every VM driver so no upstream address can clash. Queued before security-suite at Jeff''s word.'
