source: 'Regression on main found by cloud/20261109T105708Z (FLOW-09), in jks-test-skip-without-jdk f3-implement-r2: tools/workflow/check/rulechange.go''s ruleRunningRe (tier1|golangci-lint|tools/workflow) treats any changed .github/workflows line that names one as a rule-running line, so adding a job to ci-ok''s ''needs: [changes, lint, tier1, tier1-test, ...]'' list fails the FLOW-14 clearance though no rule or its enforcement changes. The attended 2026-11-07 session hit the same check and recorded a TEST-02 approval Jeff later said was not meant. Fix: match lines that run a rule (a run: or uses: step invoking tier1, golangci-lint or tools/workflow), not job names in needs lists; tier-0 test with the ci-ok needs edit. Blocks jks-test-skip-without-jdk''s f3-implement-r2 done-when.'
