source: 'Filed on Jeff''s word, 2026-11-17, in a workflow-human sitting. Jeff: the priority numbering should always match each item''s 1-indexed position in the active+pending queue (FLOW-05 order: class, in-progress before queued, then priority), with the highest-priority item at 1. Done items should not be in the numbering at all; once completed they should move to another folder, possibly keeping their implementation order in their naming (not a hard requirement now). Today wf new shifts every item at or below a new one''s priority, done ones included (queue.go Add), and wf validate requires priorities unique across done items too (queue.go Validate). follows, relations and other checks look done items up in queue/, so a done folder needs wf to read it. Placed first on Jeff''s word. On 2026-11-17 the open items were renumbered by hand to 2-15 in queue order, this item at 1, and the done items'' priorities set aside to 1000 + their old number until this item lands. Decide in the design: when renumbering runs (wf new, a start, a class change, a close, a merge), how history logs it without noise, the done-folder layout and naming, FLOW-05''s priority wording, and whether it holds any worker while the layout changes.'
