source: 'Filed on Jeff''s word, 2026-11-17, from the out-of-band streamlining assessment of that day (108 questions in one sitting, ~90 required by FLOW-07/FLOW-19 and workflow-human SKILL.md:92; ~83-86% of assumed questions historically accepted as recommended, the overrides substantive; process items otherwise cheap: 23 of 25 done ones spent 3 counted steps). One item bundling the review-grain proposals: (1) an ''all as recommended / name exceptions'' answer for assumed questions, individual asks kept for flagged ones (FLOW-07, FLOW-19 process.md:733, workflow-human SKILL.md:92); (2) as an option for Jeff, since it reverses his 2026-11-04 rule (design-approved-rule-changes.md), approving a design''s rule changes as one batch with a veto; (3) a sitting load cap (one large design, ~30 asks; SKILL.md:50); (4) a same-sitting intake-plus-review lane for trivial process changes that keeps LOOP-09''s review; (5) a process row in the intake size guide (4 steps / 1 run, +1 per state step) and honest x1-design accounting plus the bookkeeping fixes (0-run spends, shared timestamps). Merge confirmation in the observing human session (keeping its done-when check) and a shipped wf state migration in place of hand-added x4-state ride along only if the design finds them small; otherwise they are filed separately. Prior art: docs/design/workflow-streamline.md, design-approved-rule-changes.md, flow19-design-before-plan.md, human-review-shows-design.md. The assessment: artifact ''Loop streamlining assessment'' of 2026-11-17.'
