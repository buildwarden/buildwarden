source: 'Filed on Jeff''s word, 2026-11-21 (workflow-human sitting), in his words: ''make this an explicit process override that basically states this large-scale refactor is effectively the north star project until it''s complete. All work prioritization is based on achieving that goal under maximum parallelization, even if it is temporarily incompatible or breaking with the existing interfaces. While the CLI, config, and ledger will largely be expected to keep mostly similar interfaces/specs, every delay increases overall development costs where-ever it could be prioritized and parallelized post-refactor.'' Context: he had just held relay-collector-failure-fails-open (a security fix) as a follow-up of the relay separation, and vm-from-host-path (a security fix), prebuilt-artifacts and workdir-in-context until the program completes, since there is no release before it ends and usage is low. The design amends FLOW-20 (its freeze exemptions for regression and security fixes; how intake files non-program work during the program), and weighs what ''maximum parallelization'' and ''temporarily breaking'' mean for FLOW-05''s limits and relations, UX-03''s deprecation windows and the rules that keep CLI, config and ledger compatibility, saying which stay as written (FLOW-08, FLOW-14, FLOW-18, FLOW-19, the ledger and key rules). Estimate from the process size row: 4 steps + 1 if the queue state needs a migration.'
