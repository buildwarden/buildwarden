source: 'Regression on main (1173c5f), found 2026-11-12 on windows-desktop while running make test for componentization''s design branch. ''cd tools/workflow && go test ./check/ -run TestWhitespaceOnlyDifferenceFails'' fails with ''x3 on a whitespace-only difference: "", want it unmerged''. Cause: the test''s temporary repository is checked out with CRLF under the machine''s core.autocrlf=true, so its strings.Replace of "Feature line.\n" matches nothing and the squash it builds has no whitespace difference. Likely fix: have the test replace "Feature line." without the newline, or set core.autocrlf=false in the test repository. CI does not catch it: main.yml runs make test on ubuntu-latest only. The two other Windows-only failures found in the same run are fixed in PR #111 (no-design).'
