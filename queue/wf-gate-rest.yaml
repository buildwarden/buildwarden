questions:
  - id: q1
    kind: assumed
    status: open
    question: 'The gate reads nothing new (design Decision 2): its nine points stay as they are, read over REST; GitHub''s merge refuses a closed, conflicting or moved PR (the sha parameter), and the agent then re-checks and stops. Proceeding with A. Not flagged (r2): under FLOW-20 as program-autonomy (#144) left it, A neither removes nor narrows a gate point, so it meets no reserved clause, and it departs from no earlier decision.'
    options:
      - (A) keep the gate's points as they are, read over REST
      - (B) add a point that the PR is open and mergeable, from the same REST response
    recommended: (A) keep the gate's points as they are, read over REST
  - id: q2
    kind: assumed
    status: open
    question: 'Flagged: departs from loop-parallel''s earlier decision ("elsewhere gh pr ready --undo"). The draft and ready conversions name only the session''s ccr/convert_to_draft and ccr/ready_for_review routes, since every step that converts a PR is a cloud step (FLOW-04) and native settings deny gh api (design Decision 3). Proceeding with A.'
    options:
      - (A) the session routes only
      - (B) keep gh pr ready / --undo for a non-cloud session
    recommended: (A) the session routes only
