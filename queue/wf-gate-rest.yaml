source: 'Jeff, 2026-11-23 attended human session: the program sync PR #140 could not pass wf check -sync in the cloud, because check/merge.go reads the PR with gh pr view (GraphQL), which returns 403 in Claude Code cloud sessions; REST gh api repos/<o>/<r>/pulls/<n> works. Every program-trunk merge (sync, f7-merge, f6-merged-<n>) is blocked on it in the cloud. Folded in on Jeff''s word: tools/workflow/cmd/wf/wf, the built binary main has tracked since #130, is removed and ignored, since a local go build overwrites it on any branch (native-loop-fixes'' implement had to restore it).'
