questions:
  - id: q1
    kind: assumed
    status: confirmed
    question: 'Does the merge gate read the PR''s mergeability? Reopened by the process test (r3): the REST merge (PUT pulls/<n>/merge) drops gh pr merge''s client-side refusal of a BLOCKED PR for a caller that can bypass (the session''s admin token). Design Decision 2: gate point 10, a new point of the merge gate and the sync gate (not an extension of point 3), reads mergeable_state from the gate''s REST PR read and passes only on clean, unstable or has_hooks; on unknown it re-reads a bounded number of times (Q3), then refuses; never merges on unknown. FLOW-08 amended (rule_changes).'
    options:
      - (A) keep the gate's points as they are, read over REST
      - (B) add a point that GitHub reports the PR mergeable, from the same REST response's mergeable_state
    recommended: (B) add a point that GitHub reports the PR mergeable, from the same REST response's mergeable_state
    answer: '(B) the mergeable_state check (Jeff, 2026-11-24, r4): refuse unless mergeable_state is clean, unstable or has_hooks; a bypass-capable caller never merges where the loop stopped before (program-north-star Decision 9)'
  - id: q2
    kind: assumed
    status: confirmed
    question: 'Flagged: departs from loop-parallel''s earlier decision ("elsewhere gh pr ready --undo"). The draft and ready conversions name only the session''s ccr/convert_to_draft and ccr/ready_for_review routes, since every step that converts a PR is a cloud step (FLOW-04) and native settings deny gh api (design Decision 3). Proceeding with A.'
    options:
      - (A) the session routes only
      - (B) keep gh pr ready / --undo for a non-cloud session
    recommended: (A) the session routes only
    answer: (A) the session routes only (Jeff, 2026-11-24, attended); loop-parallel's 'elsewhere gh pr ready --undo' branch is dropped
  - id: q3
    kind: assumed
    status: confirmed
    question: 'How long gate point 10 waits while GitHub reports mergeable_state unknown (design Q3). Proceeding with A; confirm. Not flagged: every option refuses on unknown, so none touches a security boundary or seam, and none departs from an earlier decision (Jeff named the bound, not its size, r4).'
    options:
      - (A) up to 5 reads 2 seconds apart, constants in merge.go
      - (B) one read, refuse on unknown, the next tick retries
      - (C) a config.yaml key
    recommended: (A) up to 5 reads 2 seconds apart, constants in merge.go
    answer: (A) up to 5 reads 2 s apart, constants in merge.go (Jeff, 2026-11-24, r5)
