questions:
  - id: q1
    kind: assumed
    status: confirmed
    question: 'Fix the test, not the product: for ./warden.toml the config: line keeps naming the working directory as the process was given it (the shell''s PWD, through os.Getwd), not as links resolve it (/var/... on macOS, not /private/var/...). Proceeding with (a); confirm.'
    options:
      - (a) the tests enter their directory as a shell does (t.Chdir, which sets PWD), and a new test pins the unresolved path on every OS
      - (b) configFile resolves links (EvalSymlinks), so the line always names the real file; tests and reference updated
      - (c) the test resolves its expected path (EvalSymlinks) and nothing else changes
    recommended: (a), the design's Decision 1
    answer: (a), Jeff, 2026-11-21 (design review r1)
