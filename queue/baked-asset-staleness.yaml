    note: 'Blocking native validation (FLOW-09) per docs/design/baked-asset-staleness.md Validation plan, on the branch after consolidation, evidence under native/qemu-any/<date>/: (1) with main''s assets in the tree, warden doctor --driver qemu exits non-zero with the relay kernel and initramfs BLOCKED (source missing) naming tools/relay-vm/build-initramfs.sh and the direct-boot initramfs reported only; a cloud-image Linux build is refused before any VM with the same fix. (2) tools/relay-vm/build-initramfs.sh writes output/vmlinuz.source and output/initramfs.cpio.gz.source; doctor reports them current; the cloud-image build succeeds and its ledger verifies. (3) a direct-boot build (no image) is refused naming tools/build-vm/build-initramfs.sh; after it the build succeeds. (4) a comment edit in tools/relay-vm/init: the relay script fails at its stamp step naming make generate; after make generate and make build, doctor reports the relay assets stale with both digests and a build is refused; rerunning the relay script stamps them and the build succeeds; revert all three. (5) release layout: warden and the release-named assets copied to a directory outside any tree without their .source files are refused naming the rebuild and the copy; with the .source files the build succeeds.'
