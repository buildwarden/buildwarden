feature: baked-asset-staleness
title: One staleness check for every baked boot asset
priority: 52
follows: build-link-subnet
status: in_progress
round: feature
phase: 2
design: docs/design/baked-asset-staleness.md
branch: feat/baked-asset-staleness
alters_relationships: false
design_review: required
source: 'build-link-subnet Decision 10 (docs/design/build-link-subnet.md), approved by Jeff at design review r3 (a15: the general check as the follow-up baked-asset-staleness), queued at its Consolidation: a source digest per baked asset (qemu and Firecracker relay and direct-boot initramfs, the Hyper-V relay boot VHDX, the vz prepared image and its warden-boot), read by build and doctor, so a stale asset is refused with its rebuild command instead of failing later. It absorbs build-link-subnet''s one-time launcher stamp (WARDEN_LINK_CHANNEL, buildlink.Channel) and the Hyper-V relay-boot.source stamp that only refresh-cache.sh reads today (the overview''s second open question).'
