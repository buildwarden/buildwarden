questions:
  - id: q1
    kind: blocking
    status: open
    question: 'On hold (Jeff, 2026-11-11): the queue is paused behind a major refactor Jeff will take as the priority once the in-flight implementations finish. Answer this question only to resume the item; while it stays open the item is on hold.'
    options:
      - resume it, once Jeff makes it a priority again
    recommended: resume it, once Jeff makes it a priority again
  - id: a1
    kind: assumed
    status: open
    question: Where warden gets each asset's expected source digest (Decisions 1, 5, 9).
    options:
      - a generated manifest compiled into warden (driver/bootasset/manifest.go), kept current by a tier-0 test, the stamp tool refusing to stamp from a tree whose manifest is stale; vz prepare stamps its own manifest's value
      - warden computes the digest at run time from a source tree it finds (depends on the working directory; impossible for a release)
      - hand-bumped per-asset constants (the link-channel stamp, generalized)
    recommended: the generated manifest
  - id: a2
    kind: assumed
    status: open
    question: The asset set and where the stamp lives (Decisions 2, 4).
    options:
      - seven assets (relay-vm-aarch64, relay-vm-x86_64, firecracker-kernel, qemu-direct-boot, firecracker-direct-boot, hyperv-relay-boot, vz-image), a <file>.source beside every boot file; prepared Windows layers, Linux cloud images and container support images out of scope
      - the same without the Firecracker kernel (its rebuild is a kernel compile)
      - the same plus the prepared Windows layers (their warden-run registration)
    recommended: the seven assets with <file>.source beside every boot file
  - id: a3
    kind: assumed
    status: open
    question: What the digest covers (Decisions 3, 8).
    options:
      - CRLF-normalized content of declared files, the main-module Go and embedded files of each baked binary's packages for its target, its external modules' versions and the go directive; never git history; a coverage test classifying every tracked file under the asset tools' directories
      - the last commit touching the inputs (today's refresh-cache.sh; needs git, a dirty tree always rebuilds)
      - whole directories plus go.mod and go.sum (any dependency bump rebuilds every asset)
    recommended: the content digest of declared inputs
  - id: a4
    kind: assumed
    status: open
    question: Refuse, report, no bypass (Decision 6), and the one-time upgrade cost (every qemu and Firecracker user rebuilds the relay assets once, Firecracker users the kernel once, the rest their stamped assets once).
    options:
      - refuse before any VM boots for every boot file the build uses; doctor BLOCKED for assets every build uses, reported only for the direct-boot initramfs; no flag, key or variable skips the check
      - warn only for the relay initramfs (an old init often still works)
      - an escape-hatch environment variable such as WARDEN_ALLOW_STALE_ASSETS
    recommended: refuse and report as stated, no bypass
  - id: a5
    kind: assumed
    status: open
    question: Retire the link-channel stamp outright (Decisions 7, 8, 10), absorbing hyperv-relay-per-build-channel's relayBootChannel.
    options:
      - remove buildlink.Channel and every link-channel file; Hyper-V's relay-boot.source and relay-boot.link-channel replaced by relay-boot.vhdx.source; no period writing both stamps
      - write both stamps for one release
    recommended: retire outright (an older warden reading a kept link-channel line would boot an asset built from other sources)
  - id: a6
    kind: assumed
    status: open
    question: The qemu direct-boot initramfs bakes warden-io, an unregistered instance of D2 (Decision 12).
    options:
      - cmd/warden-io is an input of qemu-direct-boot; qemu-direct-boot-per-build-executor (append warden-io per build, as Firecracker does) named as a follow-up for intake
      - append warden-io per build in this feature
      - register it as D4 here (a BOOT-07 model change and a rule change)
    recommended: an input here, the per-build append as a named follow-up
  - id: a7
    kind: assumed
    status: open
    question: Native machines' assets once relay assets are checked (Decision 12).
    options:
      - name native-asset-refresh as a process follow-up (native-tick checks and rebuilds each asset its hosts use, as it does for the Hyper-V VHDX); until then a refused native session rebuilds by hand
      - no follow-up
    recommended: name the process follow-up
