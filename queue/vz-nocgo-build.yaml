feature: vz-nocgo-build
title: 'The macOS arm64 release build of warden does not compile without cgo: driver/vz excludes both its cgo file and its stub (regression on main)'
priority: 65
status: done
round: feature
phase: 8
design: docs/design/vz-nocgo-build.md
branch: feat/vz-nocgo-build
alters_relationships: false
design_review: required
source: 'Found by the design of prebuilt-artifacts (its ''Releases and install'', fault 3) and reproduced by the attended session on main at 3cb0b2b, 2026-11-15: ''GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/warden'' fails with driver/vz/vm.go:25:22: undefined: linuxVMConfig (also macOSVMConfig, createLinuxVM): the cgo file and its stub are both excluded under that build. .goreleaser.yaml builds the macOS arm64 warden with CGO_ENABLED=0, so no release can be cut once the release hook runs (the hook''s own two faults are prebuilt-artifacts'' to fix, its Decision 12). driver-contract''s design lists this as ''to be filed''. A regression main already has, exempt from the FLOW-20 freeze. Jeff, asked how to file it: ''Its own fix, started now'' (not a follow-up of prebuilt-artifacts, which would hold it until that item is done). Whether a no-cgo macOS warden is meant to run the vz driver at all, or to build without it and say so, is the design''s to settle; check the same build for the other release targets.'
