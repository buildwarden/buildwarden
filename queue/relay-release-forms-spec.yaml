questions:
  - id: b1
    kind: assumed
    status: open
    question: 'Flagged: component design (security posture, a new contract). The trust root: one manifest relay-release.json per release, its SHA-256 the published hash; a launcher pins version and hash in its own release, checks the manifest and every file it uses before running anything, never takes the hash from where it fetched the manifest; a self-built environment is the pinned binary plus the driver''s recipe, trusted as the driver is; no reproducibility; a signature allowed, not required. Design, Decision 4, Questions b1.'
    options:
      - (a) as stated
      - (b) as (a), with a required signature over the manifest
      - (c) per-file pins
      - (d) the hash fetched beside the manifest
    recommended: '(a): r1 notes (1), (5), (6) made precise; one reviewable value per adopted release; (b) can be added compatibly'
  - id: b2
    kind: assumed
    status: open
    question: 'Flagged: component design (the contract between every release and every launcher). The binary''s launch interface: --mode=<host|container|vm>, --claim-addr, --fd (host), --build-if (vm), WARDEN_CLAIM_TOKEN; every value required, no detected mode or defaults; vm-mode addresses configured by the environment; a boot channel is the recipe''s or the shape''s. Design, Decision 5, Questions b2.'
    options:
      - (a) as stated
      - (b) the Go relay's interface as it is, defaults and detection included
      - (c) a configuration file in place of arguments
      - (d) the VM boot channel (warden.* words, relay seed) in the core as well
    recommended: '(a): the Go relay''s interface less its guesses (GLOBAL-11)'
  - id: b3
    kind: assumed
    status: open
    question: 'Flagged: component design (the seam''s contract; the relay''s key posture, RELAY-03). What the relay requires of any environment: a seeded random source (entropy device, or processor or firmware source), a clock within 5 minutes of UTC, the network of its mode, privilege to bind 53/80/443, no persistent storage, the manifest''s memory, stderr kept. Design, Decision 6, Questions b3.'
    options:
      - (a) as stated
      - (b) as (a), with a VM device list in the core
      - (c) entropy required for VM environments only
      - (d) a different clock tolerance
    recommended: '(a): r1 note (2) names entropy for RELAY-03; devices are a recipe''s or a shape''s'
  - id: b4
    kind: assumed
    status: open
    question: 'Flagged: component design (a requirement on every relay release). The binary''s platforms and files: linux/amd64 and linux/arm64 required, others optional; plain files, not archives; Linux binaries statically linked; modes stated per binary; roles open, binary the core''s only one. Design, Decision 2, Questions b4.'
    options:
      - (a) as stated
      - (b) no required platform
      - (c) every supported platform required
      - (d) archives
    recommended: '(a): every self-built environment runs a Linux binary; an empty root file system is the simplest recipe'
  - id: b5
    kind: assumed
    status: open
    question: 'Flagged: component design (how the seam grows). Shapes named <name>/v<N>, each specified in its own specs directory relay-shape-<name> with its own tag (roles, start, claim mode, how it meets the environment requirements); none in v1. Design, Decision 7, Questions b5.'
    options:
      - (a) as stated
      - (b) unversioned shape names
      - (c) each shape a section added to the core in a minor release
    recommended: '(a): a shape is released when the relay can output it (r1 note (2)) and changes on its own'
  - id: b6
    kind: assumed
    status: open
    question: 'Flagged: component design (a change to the driver contract; departs from K1 a3 ''K1 adds no relay key'' on Jeff''s r1 notes (3), (8)). describe.capabilities.relay_shapes (compatible shapes) and the common key relay_shapes (preference list, reserved self-built), refused unless a subset with no repeat and nothing after self-built; the first listed shape the pinned release carries, else the named, reported self-built fallback; a shape that fails verification is an error; default each driver''s, [] at M6. Design, Decision 8, Questions b6.'
    options:
      - (a) as stated
      - (b) as (a), with the fallback only when the key is unset or lists self-built
      - (c) a key of each driver's own
      - (d) warden resolves the relay
    recommended: '(a): r1 notes (3) and (8); (b) is the stricter reading of GLOBAL-10 and Jeff''s to choose'
  - id: b7
    kind: assumed
    status: open
    question: 'Flagged: component design (seam 4''s content). The ledger records which relay ran: an optional relay member of the environment metadata (version, manifest_sha256, path = shape or self-built, recipe or origin), supplied by the driver in claim_values.environment.metadata, unsigned and driver-attested, required of a driver running a seam 8 release. Revisits the first design''s a6. Design, Decision 10, Questions b7.'
    options:
      - (a) as stated
      - (b) nothing recorded, left to M6
      - (c) a claim field the relay records
      - (d) a signed payload
    recommended: '(a): r1 asked to revisit; needs no relay or claim change'
  - id: b8
    kind: assumed
    status: open
    question: 'Flagged: component design (the program''s design). Amend componentization.md: seam 8''s row, the M6 row, the Later sentence, the RELAY-04 rule-table row, Defaults and overrides, the Cross-driver column heading and the sentence below it, with an Amendments entry. Design, Amendments to the umbrella design, Questions b8.'
    options:
      - (a) as proposed
      - (b) also amend Decision 11
      - (c) amend nothing
    recommended: '(a): Decision 11 still holds read as binary and shapes; (c) leaves the umbrella stating forms r1 rejected'
  - id: b9
    kind: assumed
    status: open
    question: 'Strategy. The kit''s scope here: driver/relaysource''s shape vocabulary (RelayForm becomes Shape, SelfBuilt) and resolver over an interface, drivercmd''s RelayShapes and key check; the manifest reader, fetching and recipes with the first M6 adoption. Design, Decision 12, Questions b9.'
    options:
      - (a) as stated
      - (b) the manifest reader and verification here as well
      - (c) no kit change until M6
    recommended: '(a): r1 note (8) names relaysource; (b) implements a seam not yet pinned (LOOP-07)'
  - id: b10
    kind: assumed
    status: open
    question: 'Strategy. Names kept: directory relay-release-forms, prefix FORM, manifest relay-release.json; the relay''s version in the manifest only (prebuilt-artifacts leaves it to seam 8). Design, Decision 3, Questions b10.'
    options:
      - (a) as stated
      - (b) rename the directory relay-release
      - (c) each file also states its version
    recommended: (a)
  - id: b11
    kind: assumed
    status: open
    question: Strategy. The Go relay is a known divergence (no manifest, :latest, detected mode and flag defaults, warden.net=dhcp); nothing of it changes. Design, Decision 13, Questions b11.
    options:
      - (a) as stated
      - (b) its release publishes a manifest now (release configuration, Jeff's)
    recommended: '(a): M6 retires it'
  - id: b12
    kind: assumed
    status: open
    question: Strategy. Seam 8 is adopted here later by a reconciliation item (pin, GLOBAL-08, tier 1 seams, book row, manifest reader); the driver contract and the environment metadata change in this item. Design, Decision 14, Questions b12.
    options:
      - (a) as stated
      - (b) also pin seam 8 and amend GLOBAL-08 and tier 1's seams here
    recommended: '(a): the order LOOP-07 gives'
  - id: b13
    kind: assumed
    status: open
    question: Strategy. Seam 8's suite checks a release (schema, published hash, files, required platforms, a host-mode launch case in the Linux sandbox, refusal without a required argument); environment and launcher requirements not machine-checked. The driver suite checks relay_shapes in describe and the key's refusals against the fake. Design, Questions b13.
    options:
      - (a) as stated
      - (b) static release checks only
      - (c) a recipe case
    recommended: (a)
  - id: b14
    kind: assumed
    status: open
    question: 'Flagged: privileged work (CI and release configuration, Jeff''s). The specs repository''s release and implementations workflows name the six directories; this item''s specs PR does not touch .github/, and relay-release-forms/v0.1.0-dev.1 waits for them. Design, Decision 15, Questions b14.'
    options:
      - (a) Jeff changes both workflows to read the list from the Makefile's SPECS
      - (b) this item's specs PR changes them and goes to specs main by Jeff's merge
      - (c) the directory added by hand
    recommended: (a)
