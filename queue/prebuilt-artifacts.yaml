    kind: assumed
    status: confirmed
    question: 'How this item waits for project-config-trust (design: How it sits with the other items). Its merge comes after that item''s (Jeff, that item''s a6); both edit driver/hostutil.go, two drivers'' test files and the same doc sentences, and this item deletes what that one adds (ModuleRoot, the test-only setter of the tree, two TestMains, two messages, three doc sentences). Proceeding with: this item''s Plan starts after project-config-trust''s PR has merged, held as K1 is: a blocking question that names the merge, with a human step that f2-plan needs, written by the session that records this design''s review (a blocking question raised by Design would hold Design itself). Under a9 (A) the merge named is K1''s, which implies this one.'
