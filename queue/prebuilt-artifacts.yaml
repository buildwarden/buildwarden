questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: 'The lookup, made precise (design: The lookup; Decision 2). Jeff''s sentence gives the two places and the trigger: "warden looks for necessary artifacts to be on PATH and searches its own directory if they''re not found or not on or above a minimum version". Proceeding with: the first directory on PATH that holds the artifact is the PATH candidate and no later entry is tried; warden''s own directory met on PATH is that candidate when it comes first, so a copy in a later entry is never used (driver-contract''s rule); a candidate reached through a relative or empty PATH entry stops the lookup with an error, as driver-contract''s lookup does; a PATH candidate that fails its check is passed over, with a stderr line on every run, for the copy beside warden; if that is missing or fails too, a fixable error names both; no flag, variable or config key names an artifact''s file; a kernel and initramfs set uses the same lookup as an executable, the whole set from one directory; no execute permission is asked for, since the host runs almost none of these files; a newer artifact is used without comment; every file is read once into the build''s work directory and the check, the digest and every later use are of that copy; every build writes <output>/host-files.json (each file''s path, version, digest, found: PATH or beside-warden, what was passed over; the container images with the IDs they resolved to; Hyper-V''s relay boot disk; vz''s baked executor) and warden doctor --driver <name> prints a Host files block. The name is host-files.json and not artifacts.json because artifacts/ in the output directory is the build''s own outputs. The lookup never runs a file. It finds BuildWarden''s own relay and executor wherever they are installed; a different build of them on PATH is used and recorded and is not a supported substitution (GLOBAL-08 stands).'
    options:
      - '(A) as stated: driver-contract''s lookup plus exactly what the sentence adds (a check, and the second place when it fails)'
      - '(B) every PATH entry in turn until one is acceptable, then beside warden: more forgiving, and which file wins is harder to predict'
      - '(C) executables by this lookup, kernels and initramfs only beside warden: PATH then holds only programs, at the cost of a second rule'
    recommended: (A) as stated
    answer: '(A) As stated: the first PATH candidate, then beside warden. As recommended. Answered 2026-11-15.'
  - id: a9
    kind: assumed
    status: confirmed
    question: 'The order of this item and driver-contract (K1) (design: How it sits with the other items; In K1''s structure; Rule changes, the second setting). The two rewrite the same code (GuestBinary''s callers, the container driver, the relay''s lookups) and the same sentence of BOOT-02, and K1 was approved on 2026-11-15 at a6c8f0b on main''s sentence. Jeff''s reason for making this its own item (project-config-trust''s a6) was that K1 is not held behind its native validation, so "K1 waits for this item" is not proposed. What his words leave open is whether this item waits for K1. Proceeding with: K1 merges first. This item''s Plan starts when K1''s PR has merged (which implies project-config-trust''s, a8), held as a8 describes; the item then returns to Design once (FLOW-06) for the delta K1''s structure brings (who links the lookup, relaysource.Bundled without Source and GoBuild, and the record reported by a driver binary through the driver contract, which adds that seam), and is implemented once. Its BOOT-02 wording on top of K1''s sentence is in this design and approved by this review, so no rule is reviewed twice. The cost, plainly: "Remove compilation now" becomes "after K1 has merged". What F9 names, a repository''s source compiled on the host, is closed by project-config-trust''s merge either way; what waits is a warden inside its own tree compiling that tree.'
    options:
      - '(A) K1 first, as stated: no second review of K1, the program''s key item is not disturbed, no code is written twice, each of the four blocking native hosts validates this item once; it is FLOW-05''s own reasoning about two features that reshape the same structure'
      - '(B) no order: both are planned when project-config-trust has merged and whichever reaches Publish second consolidates on the other (FLOW-10). If that is this item, its Implement is redone in K1''s structure and its native hosts validate again. If it is K1, K1 goes back to Design (FLOW-06, FLOW-14) for its BOOT-02 wording, its named fallback "beside the binary, else the source tree" and its relaysource types, and its native hosts validate again, which delays K1 by this item after all. Sooner for this item only if it wins the race'
      - '(C) this item first, and K1''s Plan waits for it: shown for completeness; it is the order Jeff''s answer to project-config-trust''s a6 ruled out'
    recommended: (A) K1 first; this item's Plan waits for K1's merge
    answer: '(A) K1 first: this item''s Plan waits for driver-contract''s merge, then one return to Design for the delta K1''s structure brings. As recommended. Answered 2026-11-15.'
  - id: a2
    kind: assumed
    status: confirmed
    question: 'The minimum version, and BOOT-02 (design: Decision 3; The version; Rule changes; Bootstrap comparison; The front matter, argued). Proceeding with: the minimum for an executor or a relay binary is the version of the warden that looks for it, with nothing kept by hand in code; a newer artifact is accepted; a development warden (dev) takes only dev and a release never takes dev. BOOT-02 on main says the executor "matches the orchestrator''s version"; at or above is not that, so BOOT-02 is amended ("its version is at or above the orchestrator''s: an executor that states an older version, or none, is not delivered"), one paragraph defining the version line and dev is added to bootstrap.md''s model text, and the Bootstrap comparison is one the review must accept (BOOT-07). The amendment is the one ground that makes alters_relationships true (compilation leaving warden for development tooling moves no responsibility between components), so this item holds the third of FLOW-05''s three slots beside driver-contract and seam-specs: until one of the three has merged no other item that alters relationships can be planned (in the program''s second wave, S2, S3 and S4), and under a9 (A) this item holds its slot while it waits for K1. The design gives the BOOT-02 wording in both settings (as main has the sentence, and as driver-contract leaves it) and asks for both to be approved.'
    options:
      - '(A) as stated: at or above warden''s own version, BOOT-02 amended; it is "on or above a minimum version" in Jeff''s words, and the form that survives a driver living in its own repository (K3)'
      - '(B) exactly warden''s version: a newer file on PATH is passed over like an older one; BOOT-02 stands as written, no rule change, no Bootstrap comparison, alters_relationships false and the slot free'
      - (C) a minimum per artifact, kept in code and lower than warden's version; BOOT-02 amended as in (A); a table to keep, and a release could then run an older executor from PATH in place of the one it shipped with
    recommended: (A) at or above warden's own version, with BOOT-02 amended
    answer: (A) At or above warden's own version; BOOT-02 amended. As recommended. Answered 2026-11-15.
  - id: a3
    kind: assumed
    status: confirmed
    question: 'How an executable artifact states its version without being run (design: Decision 4; The version). Most of these files are for another OS or architecture and cannot run on the host, and running a candidate to ask its version would execute a file the lookup may then reject. Proceeding with: one line of bytes in the file, buildwarden-version=<version>; set when the binary is linked (make build sets dev unless VERSION is given; the release build sets the release) and found by scanning the file; it is what warden --version prints, and warden-io and the relay gain a --version that prints theirs, because a variable no reachable code reads is dropped by the linker (tried: imported and unread, 0 lines in the binary; printed by a --version branch with -trimpath, 1; without -trimpath, 3 identical, because Go''s build information records the linker flags; a bare go build, 0). Every build uses -trimpath; the reader takes all matches, identical ones are one statement, and a file with none or with two that differ states no version and is not accepted.'
    options:
      - '(A) as stated: one version, said by whoever builds the binary, the same in any language and under any way of building; cost: a format of this project''s own, and development builds are all dev, so a stale file left in dist/ beside a rebuilt warden is not detected (main rebuilt it automatically; make build rebuilds everything)'
      - '(B) Go''s build information, read with debug/buildinfo (what go version -m prints; tried: a binary built in this worktree states v0.6.1-0.20261115193423-ad4ea5002e24, read from a Windows and a macOS binary on Linux): nothing to invent, development builds are ordered by commit, and the file''s OS and architecture can be checked; cost: no version without a git checkout with tags (go run, a source archive and -buildvcs=false give (devel); a shallow clone gives v0.0.0-...), a second version beside the one warden --version prints, and Go only, so a relay in another language cannot state it'
      - '(C) a sidecar file beside each artifact, or one manifest per directory: works for any file; a copied binary loses its sidecar, and a manifest in a PATH directory is shared with whatever else is installed there'
    recommended: (A) the version line in the file
    answer: (A) The line in the file, with --version on the three programs and -trimpath. As recommended. Answered 2026-11-15.
  - id: a4
    kind: assumed
    status: confirmed
    question: 'The container driver''s images, now that warden builds none (design: Decision 6; The relay image, the holder and the sidecar). On main a development warden, and any warden given relay_image = "dev", compiles the relay and builds an image per build, and any warden with no digest compiled in builds the holder and the iptables sidecar images tagged by content hash, so no checkout runs another''s images. Proceeding with: make images CTR=<runtime> builds the three images (the relay''s from Dockerfile.relay, the file the published image is built from), tags each by the hash of its inputs (warden-relay-dev:<hash>, warden-holder-dev:<hash>, warden-netns-dev:<hash>) and writes the three references to dist/warden-dev-images.json; a warden with no reference compiled in runs exactly those, read from beside itself only, never pulled and never built by warden; when the record or an image is absent the build is refused before anything is created, with the fix naming make images; relay_image = "dev" and WARDEN_IMAGE=dev keep working and mean the recorded relay image; a release''s defaults are untouched (the relay pulled from ghcr.io/buildwarden/relay:latest, the holder and sidecar by compiled-in digest); no version is checked on an image, and a rebuilt relay cannot run from a stale image because its tag changes. The first draft had three fixed tags (option B); the review showed that warden clean, on main and in every release, removes warden-relay:dev, and that one set per runtime is shared by every checkout on a machine, so a native session testing several branches could pass on another branch''s relay.'
    options:
      - '(A) as stated: each checkout runs the images it built, and no warden clean, old or new, removes them'
      - '(B) three fixed tags, warden-relay:dev, warden-holder:dev and warden-netns:dev, and no record: less to build; one set per runtime is shared by every checkout, warden clean must be taught to skip dev and every older warden''s clean still removes the relay''s, and each native container case must run make images from the branch under test immediately before its builds and record the image IDs'
      - '(C) as (A), and the value dev is removed: a release refuses it with the fix, and a development warden needs no key to use its images'
    recommended: (A) as stated; the release default staying the moving tag :latest is as on main and is left to seam 8
    answer: (A) Content-hash-tagged -dev images recorded beside warden; relay_image = dev means the recorded relay image. As recommended. Answered 2026-11-15.
  - id: a5
    kind: assumed
    status: confirmed
    question: 'Boot assets, and what a release ships (design: Decisions 5 and 11; Releases and install). No release carries the relay VM or direct-boot kernel and initramfs for qemu or Firecracker, and there is no Windows release; on main those drivers work only from a source tree. Proceeding with: the boot-asset sets are found by the same lookup, each whole set from one directory; a directory is a candidate when it holds the set''s kernel and initramfs files, and the link-channel stamp is the check, applied where and when it is today (only to a build that boots the stamped file, which is direct boot; requiring warden''s version would mean a kernel rebuild per release); make build copies the assets a tree has built into dist/; no release ships them, as today, and the error says so and how to build and place them; the release archive does gain every executable under the name it is looked up by, so an installed release has the relay and executor for qemu and Firecracker and lacks only the boot assets; Hyper-V''s relay boot VHDX stays in the hyperv cache or WARDEN_RELAY_BOOT_VHDX, since warden neither compiles it nor looks in a tree for it.'
    options:
      - '(A) as stated: the item removes compilation and changes no release''s reach; the relay''s appliance is track M''s to release (seam 8) and a driver''s own boot assets are its repository''s (K3, K4)'
      - (B) the release workflow also builds the qemu and Firecracker boot assets and ships them in the archive, so an installed release runs those drivers with nothing built; a kernel build and Alpine downloads in every release, and more to validate natively
      - (C) as (A), and every boot-asset set also gets a version file and a minimum in code, so one rule covers every artifact
    recommended: (A) as stated
    answer: (A) The same lookup; the stamp as the check where it is today; no release ships them; no Windows release. As recommended. Answered 2026-11-15.
  - id: a6
    kind: assumed
    status: confirmed
    question: 'qemu''s direct boot bakes the executor into its initramfs (design: Decision 8). Found while taking the inventory: tools/build-vm/build-initramfs.sh compiles warden-io into the direct-boot initramfs and the qemu driver boots it as it is, so the executor of a qemu direct-boot build is the one from the day the asset was built. That is not "delivered per build" (BOOT-02), it is not in the deviation register, and it would be an executor the lookup never sees. Proceeding with: fixed in this item; the qemu driver appends the executor the lookup found to the initramfs per build, as Firecracker does (relayvm.AppendFileCPIO), and the script stops compiling it; the qemu / Linux row of bootstrap.md''s mapping is corrected to say so. It brings a driver into line with the model and is not a model change (BOOT-07).'
    options:
      - '(A) fixed here: a dozen lines in a driver this item already changes and validates on qemu-any'
      - (B) filed as its own item; this item's Security note then says the direct-boot executor is the asset's and is not found by the lookup
    recommended: (A) fixed here
    answer: '(A) Fixed here: qemu direct boot appends the executor per build. As recommended. Answered 2026-11-15.'
  - id: a7
    kind: assumed
    status: confirmed
    question: 'The release''s file names, and the release build (design: Decisions 9 and 12; Inventory; Releases and install; What stops working, case 7). No published release has the layout main''s configuration describes: the last one, v0.5.0, holds warden and warden-io, and the only release attempted since (v0.6.0) failed in the before hook, which cannot run as written (sh -c with no argument); with its form corrected goreleaser refuses the hook''s output directory (dist is not empty), and then the macOS arm64 warden does not compile. install.sh is fetched from main and installs the latest published release, or any version named. Proceeding with: a new archive carries warden-io-<os>-<arch> and warden-relay-<os>-<arch> and no warden-io or warden-relay; install.sh names no file but warden and installs every warden* file of whatever archive it downloaded, so v0.5.0 still installs as it does today, and it leaves an older warden-io where it is; a release upgraded by copying only warden gets an error at once that names the older install''s warden-io and the fix (on main the new warden silently runs the old executor), kept until 1.0 under TRANSITIONAL(artifact-names); the hook becomes one make target that writes outside goreleaser''s dist, and CI''s build job runs goreleaser check and a snapshot release and checks each archive against the artifact list. The macOS arm64 compile failure is main''s regression and is filed as this item''s follow-up (FLOW-09); until it is fixed the snapshot leaves the darwin targets out and the macOS archive''s layout is unproven.'
    options:
      - '(A) as stated: one name per file, the same in dist/, in the archive and on PATH, and a release configuration that is run before it is relied on'
      - (B) the archive carries both names for the Linux binaries until 1.0; nothing reads the old names, so it only delays the day a hand-made upgrade script fails
    recommended: (A) as stated
    answer: (A) New names only, as stated. As recommended. Answered 2026-11-15.
