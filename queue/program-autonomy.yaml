questions:
  - id: q1
    kind: assumed
    status: confirmed
    question: 'Flagged: tags are a reserved rule and the session policy is Jeff''s. How the loop creates pre-release and final tags (design D3).'
    options:
      - (a) wf tag through the REST refs API from the cloud session, create-only, at the sha tag-next checked
      - (b) a tag workflow per repository dispatched over REST (CI/release changes, App token and Actions bypass)
      - '(c) native sessions: the cloud loop records each tag wf tag-next names as due (a tag-due record in program/records.yaml at the checked commit); the next macbook or windows-desktop native session creates it with Jeff''s credentials through native-tag.sh, an annotated tag pushed create-only, and records it with wf record -kind tag'
    recommended: (c); (a) and a git push of a tag are both refused by the cloud session's proxy (r2's finding)
    answer: (c) native sessions create due tags (Jeff, r2, 2026-11-24); (a), confirmed in r1, was found refused by the cloud session's proxy
  - id: q2
    kind: assumed
    status: confirmed
    question: 'Flagged: departs from FLOW-20''s reserved list as Jeff wrote it. How the list reads merging and tags (design D2).'
    options:
      - (a) merging to a trunk and release tags without a suffix; program-trunk merges and pre-release tags reserved only by effect
      - (b) drop merging and tags from the list
      - (c) unchanged
    recommended: (a)
    answer: (a) narrow the reserved reading as in D2 (2026-11-24, r1)
  - id: q3
    kind: assumed
    status: confirmed
    question: 'Flagged: setup on nine repositories, Jeff''s. Program-trunk rulesets require their checks and up-to-date branches, and no approving review (design D1).'
    options:
      - (a) yes
      - '(b) no: rely on the loop''s per-repository serialization'
    recommended: (a)
    answer: 'yes: program-trunk rulesets require checks and up-to-date branches, no approving review; Jeff sets them up (2026-11-24, r1)'
  - id: q4
    kind: assumed
    status: confirmed
    question: The loop merge step itself is outside the budget and the runaway hold (design D4).
    options:
      - '(a) yes: every step from Merge on'
      - (b) only confirmations and Close
    recommended: (a)
    answer: as recommended (batch), Jeff, 2026-11-24
  - id: q5
    kind: assumed
    status: confirmed
    question: wf-gate-rest and sync-pr-tier1 (design D2).
    options:
      - (a) both stay with Jeff now (the amendment is not on main); wf-gate-rest-like changes take the process test after this merges, sync-pr-tier1-like ones stay his (a relaxed check)
      - (b) re-route wf-gate-rest to the process test on Jeff's word now
    recommended: (a)
    answer: as recommended (batch), Jeff, 2026-11-24
  - id: q6
    kind: assumed
    status: confirmed
    question: 'Flagged: a new permission in settings.native.json is Jeff''s. The allow entry for native-tag.sh, the native session''s one route for creating a due tag (design D3, Q6).'
    options:
      - (a) add "Bash(tools/workflow/native/native-tag.sh:*)" to allow, every deny unchanged (the script is already inside Bash(tools/workflow/*); the entry names the route)
      - (b) rely on the existing Bash(tools/workflow/*) alone, no change to the file
      - '(c) allow Bash(git -C .dev/checkouts/* push origin refs/tags/*) and narrow the deny Bash(git -C * push*): * spans spaces, so it admits --force, deletes and other refs'
    recommended: (a)
    answer: (a) add Bash(tools/workflow/native/native-tag.sh:*) to settings.native.json allow; no deny change (2026-11-24, r3)
  - id: q7
    kind: assumed
    status: confirmed
    question: 'Flagged: setup on Jeff''s machines and rulesets, and hosts.yaml is his to edit. Which machines list which repositories, so a due tag has a clone to be created from (neither lists buildwarden-specs or buildwarden-ai-workflow today), and as whom (design D3, Q7).'
    options:
      - (a) windows-desktop (always on) lists all nine repositories, macbook unchanged
      - (b) both machines list all nine (more backlog sweeps as more trunks move)
      - (c) add only buildwarden-specs and buildwarden-ai-workflow, to windows-desktop
    recommended: (a); in each, Jeff clones the added repositories on the machine and each release-tags ruleset lets his account create -dev.N, -rc.N and the final tag
    answer: (a) windows-desktop lists all nine repositories and creates every tag; macbook unchanged; Jeff clones the added repositories (2026-11-24, r3)
