questions:
  - id: q1
    kind: assumed
    status: open
    question: 'Flagged: tags are a reserved rule and the session policy is Jeff''s. How the loop creates pre-release and final tags (design D3).'
    options:
      - (a) wf tag through the REST refs API from the cloud session, create-only, at the sha tag-next checked
      - (b) a tag workflow per repository dispatched over REST (CI/release changes, App token and Actions bypass)
      - (c) native sessions push tags
    recommended: (a), if Jeff confirms the session policy allows it; otherwise a return to Design for (b), no fallback in code
  - id: q2
    kind: assumed
    status: open
    question: 'Flagged: departs from FLOW-20''s reserved list as Jeff wrote it. How the list reads merging and tags (design D2).'
    options:
      - (a) merging to a trunk and release tags without a suffix; program-trunk merges and pre-release tags reserved only by effect
      - (b) drop merging and tags from the list
      - (c) unchanged
    recommended: (a)
  - id: q3
    kind: assumed
    status: open
    question: 'Flagged: setup on nine repositories, Jeff''s. Program-trunk rulesets require their checks and up-to-date branches, and no approving review (design D1).'
    options:
      - (a) yes
      - '(b) no: rely on the loop''s per-repository serialization'
    recommended: (a)
  - id: q4
    kind: assumed
    status: open
    question: The loop merge step itself is outside the budget and the runaway hold (design D4).
    options:
      - '(a) yes: every step from Merge on'
      - (b) only confirmations and Close
    recommended: (a)
  - id: q5
    kind: assumed
    status: open
    question: wf-gate-rest and sync-pr-tier1 (design D2).
    options:
      - (a) both stay with Jeff now (the amendment is not on main); wf-gate-rest-like changes take the process test after this merges, sync-pr-tier1-like ones stay his (a relaxed check)
      - (b) re-route wf-gate-rest to the process test on Jeff's word now
    recommended: (a)
