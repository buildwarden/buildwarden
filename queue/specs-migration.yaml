questions:
  - id: a1
    kind: assumed
    status: open
    question: Directory mapping - one specs/ directory per existing schema, named after it (metadata-http-open/, metadata-http-headers/, ..., metadata-environment-container/ legacy), rather than a grouped metadata-http/?
    options:
      - one directory per schema
      - grouped metadata-http/ holding three schemas
      - one directory per schema with short names
    recommended: one directory per schema
  - id: a2
    kind: assumed
    status: open
    question: $id policy - every existing $id (https://github.com/buildwarden/buildwarden/schemas/v1/<name>.json) and the relay's header URIs stay unchanged forever as stable names; new schemas take ids mirroring their specs/ path?
    options:
      - keep legacy ids, new ids mirror specs/ paths
      - re-id everything to specs/ paths and change the header URIs
      - keep the legacy schemas/v1/ form for new ids too
    recommended: keep legacy ids, new ids mirror specs/ paths
  - id: a3
    kind: assumed
    status: open
    question: Environment payload schemas (oci-image/v1, vm-disk-chain/v1) go in a new specs/environment-<type>/ family, with a RELAY-05 layout amendment proposed (FLOW-14)?
    options:
      - environment-<type>/
      - metadata-environment-<type>/ (fits today's layout text literally)
      - inside build-ledger/
    recommended: environment-<type>/
  - id: a4
    kind: assumed
    status: open
    question: Tier 1 schema-doc's reverse direction (document changed, schema not) becomes MUST for paired specs/ directories, prose-only fixes using a Tier1-Allow trailer?
    options:
      - MUST, as RELAY-05 reads
      - keep it a hint
    recommended: MUST, as RELAY-05 reads
  - id: a5
    kind: assumed
    status: open
    question: Compatibility - remove schemas/ with no stub, redirect the old book URL design/ledger-spec.html to specs/build-ledger/v1.html, and note in the release changelog that raw schemas/v1/ file URLs stop working?
    options:
      - remove, redirect the book page, changelog note
      - keep schemas/v1/ copies for one release
      - a schemas/README.md stub
    recommended: remove, redirect the book page, changelog note
  - id: a6
    kind: assumed
    status: open
    question: 'Front-matter - seams: [ledger-format] (declared conservatively: its documents and published locations move, its bytes do not), alters_relationships: false, drivers: []?'
    options:
      - as stated
      - 'seams: [] since the format does not change'
      - 'also alters_relationships: true'
    recommended: as stated
