questions:
  - id: q1
    kind: blocking
    status: answered
    question: f3-implement re-pins tools/build-vm and tools/firecracker-vm to Alpine 3.21's current busybox-static (a2 (C)), which needs dl-cdn.alpinelinux.org. The cloud environment's network policy refuses that host (proxy connect_rejected, 2026-11-09 and again 2026-11-10), so the step cannot fetch the package or its digest; FLOW-05 order kept the cloud on it (tick cloud/20261110T105938Z). How should it proceed?
    options:
      - allow dl-cdn.alpinelinux.org in the cloud environment's network settings, then answer this so the cloud retries
      - give the busybox-static version and its sha256 here, and the cloud pins them without fetching (verified on a native machine later)
      - run f3-implement in an attended or native session that can reach the host
    recommended: allow dl-cdn.alpinelinux.org in the cloud environment's network settings, then answer this so the cloud retries
    answer: 'allow dl-cdn.alpinelinux.org (Jeff, 2026-11-11): the environment now allows *.alpinelinux.org; a fetch of dl-cdn.alpinelinux.org returned 200, so the cloud retries f3-implement'
  - id: a1
    kind: assumed
    status: confirmed
    question: Where the build-vm script's busybox fetch lives (Decision 1).
    options:
      - a self-contained pinned fetch in tools/build-vm/build-initramfs.sh, its ALPINE_VERSION and BUSYBOX_VERSION tied to tools/firecracker-vm/build-initramfs.sh's by a tier-0 test
      - a shared helper under tools/, added to firecracker.yml's asset cache key and path filter
      - tools/relay-vm/build-initramfs.sh fetches busybox into its cache again
    recommended: a self-contained pinned fetch in tools/build-vm/build-initramfs.sh, its ALPINE_VERSION and BUSYBOX_VERSION tied to tools/firecracker-vm/build-initramfs.sh's by a tier-0 test
    answer: (A) self-contained fetch in tools/build-vm (Jeff, r1)
  - id: a2
    kind: assumed
    status: confirmed
    question: How Implement obtains the sha256 of Alpine 3.21's aarch64 busybox-static-1.37.0-r14.apk; the design session's sandbox could not reach dl-cdn.alpinelinux.org (proxy refusal).
    options:
      - Implement downloads and pins it, proposing dl-cdn.alpinelinux.org through the environment tools if the sandbox blocks it, else stops with a finding naming the host
      - Jeff supplies the checksum in the design review and Implement pins it
      - re-pin both direct-boot scripts to the branch's current busybox-static (only if r14 has left Alpine 3.21; re-keys Firecracker's CI asset cache once)
    recommended: Implement downloads and pins it, proposing dl-cdn.alpinelinux.org through the environment tools if the sandbox blocks it, else stops with a finding naming the host (Jeff's checksum as the fallback; re-pin both only if r14 is gone)
    answer: (C) re-pin both scripts to Alpine 3.21's current busybox-static now (Jeff, r1); folded into the design
