d concurrent durable build is refused before any VM naming both holders and --slots; a --keep-vms build''s slot stays busy (doctor names it) until its VMs are removed. (7) refusals: [vm] build_link inside the durable NAT prefix refused at build start and in doctor; [vm] dns = [<host NAT IP>] refused naming the entry; a relay VM booted by hand with no seed prints the no-seed line and starts no relay. (8) resolvers (sent in the claim, design r3): with the host DNS public and [vm] dns set to that resolver, the build resolves it and console and doctor list only the key''s resolver; with [vm] dns set to an address with no DNS server, lookups fail (no fallback to the host''s). (9) no lease: a --keep-vms build VM moved to an empty Private switch and restarted logs a failed relay wait naming the NIC address and origin (169.254 WellKnown reads no DHCP lease), applies no static address, and powers off. Jeff, attended 2026-11-12: the two host-DNS halves (case 7''s 127.0.0.1-only refusal, case 8''s host DNS on an internal resolver) are dropped from native validation, since changing the host''s DNS can cut the native session off; their tier-0 coverage (default-route DNS parser on canned output, resolvers.Check) stands in. Evidence under native/windows-hyperv/<date>/.'
