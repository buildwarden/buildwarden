    note: 'Blocking native validation (design Validation plan, FLOW-09), on the branch after consolidation: (1) upgrade: main''s relay VHDX (stamp 1) BLOCKED in doctor and refused before any VM, both naming tools/relay-vm/hyperv/refresh-cache.sh; after it, stamp 2 and doctor current. (2) elevated default Windows guest build succeeds, ledger verifies; relay console shows the seed''s allocated NAT address, gateway and the host''s resolvers, and no token value; the guest NIC ends DHCP Enabled: No, PrefixOrigin Manual at the seed''s address. (3) while a relay waits, a claim and a tunnel from the host with no token and a wrong token get 401; the build then succeeds. (4) two concurrent ephemeral builds succeed with different relay addresses (VM Notes, consoles). (5) warden setup --driver hyperv --nat-prefix 192.168.250.0/24 --host-ip 192.168.250.1 (default NAT removed): a non-elevated Hyper-V Administrators build uses that prefix and succeeds, doctor prints prefix and host IP, an elevated build reuses the same NAT. (6) two concurrent durable builds on warden-dev succeed with different access VLANs; from build VM A, ARP/ping to relay B''s and build VM B''s link addresses and a DHCP DISCOVER get no answer from B. (7) refusals: [vm] build_link inside the durable NAT prefix refused at build start and in doctor; host default-route interface with only 127.0.0.1 as DNS refused naming it; a relay VM booted by hand with no seed prints the no-seed line and starts no relay. (8) with the host DNS on an internal resolver, a build resolves a name only it answers. Evidence under native/windows-hyperv/<date>/.'
