      expires: null
    note: 'Blocking native validation (design Validation plan, FLOW-09; r2 cases), on the branch after consolidation: (1) upgrade: main''s relay VHDX (stamp 1) BLOCKED in doctor and refused before any VM, both naming tools/relay-vm/hyperv/refresh-cache.sh; after it, stamp 2 and doctor current. (2) elevated default Windows guest build succeeds, ledger verifies; relay console shows the seed''s allocated NAT address, gateway and the host''s resolvers, and no token value; warden-run.log shows initialize --gateway=<relay> with no --ip, and the guest NIC ends DHCP Enabled: Yes, PrefixOrigin Dhcp at the link''s guest address. (3) while a relay waits, a claim and a tunnel from the host with no token and a wrong token get 401; the build then succeeds. (4) two concurrent ephemeral builds succeed with different relay addresses (VM Notes, consoles). (5) on a host set up by main, a durable build is refused naming warden setup; then warden setup --driver hyperv --nat-prefix 192.168.250.0/24 --host-ip 192.168.250.1 --slots 2 (default NAT removed) retires the old warden-dev switch; doctor prints prefix, host IP and two free slots; a non-elevated Hyper-V Administrators build uses that prefix and slot warden-dev-0 (relay VM Notes) and succeeds; an elevated build reuses the same NAT on its own ephemeral switch. (6) two concurrent durable builds take warden-dev-0 and warden-dev-1 and succeed; from build VM A, ARP/ping to relay B''s and build VM B''s link addresses and a DHCP DISCOVER get no answer from B; a third concurrent durable build is refused before any VM naming both holders and --slots; a --keep-vms build''s slot stays busy (doctor names it) until its VMs are removed. (7) refusals: [vm] build_link inside the durable NAT prefix refused at build start and in doctor; host default-route interface with only 127.0.0.1 as DNS and no [vm] dns refused naming it and both fixes; [vm] dns = [<host NAT IP>] refused naming the entry; a relay VM booted by hand with no seed prints the no-seed line and starts no relay. (8) resolvers: with the host DNS on an internal resolver, a build resolves a name only it answers; with the host DNS public and [vm] dns set to that resolver, the build resolves it and console and doctor list only the key''s resolver; with [vm] dns set to an address with no DNS server, lookups fail (no fallback to the host''s). (9) no lease: a --keep-vms build VM moved to an empty Private switch and restarted logs a failed relay wait naming the NIC address and origin (169.254 WellKnown reads no DHCP lease), applies no static address, and powers off. Evidence under native/windows-hyperv/<date>/.'
