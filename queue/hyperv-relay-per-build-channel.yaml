questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: The pre-claim channel into the Hyper-V relay VM and the claim token (Decisions 1, 3).
    options:
      - a per-build seed ISO (IMAPI2, label WARDENRELAY) on a DVD attached before boot, read once by the init, holding the NAT address, prefix, gateway, resolvers and a fresh 32-byte claim token StartRelay then sends
      - Hyper-V KVP host-to-guest items
      - SMBIOS strings set through WMI
      - a claim over hvsock instead of the NAT
    recommended: the per-build seed ISO, with SMBIOS strings as the fallback if the DVD path fails native validation
    answer: (a) seed ISO; SMBIOS fallback (Jeff, r1)
  - id: a2
    kind: assumed
    status: confirmed
    question: How each relay gets its own NAT address (Decision 4).
    options:
      - lowest free host of the NAT prefix under a host lock, in-use set read from the Notes of existing warden-relay-* VMs, the address written to the new VM's Notes before the lock is released
      - lease files in the lock directory
      - a per-address file lock held for the build
    recommended: lowest free host under a host lock, recorded in the relay VM's Notes
    answer: (a) VM Notes under a host lock (Jeff, r1)
  - id: a3
    kind: assumed
    status: confirmed
    question: The relay's upstream DNS (Decision 6).
    options:
      - the host's resolvers from its default-route interface, filtered by Firecracker's rule moved to a shared driver/resolvers, and a fixable refusal when none qualifies
      - the same with a public-resolver fallback
      - keep 8.8.8.8
      - a new [vm] dns key
    recommended: the host's resolvers with Firecracker's filter and a fixable refusal; a [vm] dns key only as a follow-up if the refusal proves common
    answer: 'CHANGE (Jeff, r1): host resolvers by default; an optional [vm] dns key that, when set, is used explicitly with no fallback to the host''s; refuse if none'
  - id: a4
    kind: assumed
    status: confirmed
    question: The durable strategy's shared Private switch (Decision 7).
    options:
      - a per-build access VLAN on the durable switch, set on the relay's build NIC and the build VM's NIC before they start
      - one durable build at a time (a host lock held for the build)
      - a per-build Private switch (needs full Administrator)
    recommended: a per-build access VLAN, with one-at-a-time as the fallback if native validation finds VLAN filtering does not hold
    answer: 'CHANGE (Jeff, r1): (c) a per-build Private switch for durable builds (needs elevation)'
  - id: a5
    kind: assumed
    status: confirmed
    question: Honouring --nat-prefix and --host-ip per build (Decision 5).
    options:
      - every build reads the NAT it uses back from the host (Get-NetNat prefix, the NAT switch's host vNIC address), ephemeral builds reuse the dev switch's NAT when it exists, and a NAT prefix overlapping the build link is refused at build start and in doctor
      - persist setup's flags and read them per build
      - honour them on durable builds only
    recommended: read the NAT back from the host, reuse the dev switch's NAT for ephemeral builds, refuse an overlap at build start and in doctor
    answer: (a) read the NAT back from the host (Jeff, r1)
  - id: a6
    kind: assumed
    status: confirmed
    question: 'The Windows guest''s NIC after build-link-subnet (Decision 8; windows-desktop finding: PrefixOrigin Dhcp where main''s was Manual).'
    options:
      - warden-io initialize --ip on Windows turns DHCP off on the interface and sets the static address, route and DNS, logging the final state, so the guest ends Manual whether or not it took the lease first
      - leave it DHCP-configured, as after build-link-subnet
      - drop --ip from warden-run.ps1 and rely on the lease alone
    recommended: make it static in initialize
    answer: 'CHANGE (Jeff, r1): (c) drop --ip on Windows and rely on the relay''s lease alone'
  - id: a7
    kind: assumed
    status: confirmed
    question: BOOT-06's per-build network-value extension (Decision 10; rule change BOOT-06).
    options:
      - take the amendment now that it holds on every driver, and remove the relay init's baked network defaults
      - remove the defaults but leave BOOT-06 as it is (alters_relationships and the bootstrap-model seam drop out; the review is still required)
      - neither
    recommended: take it, and remove the defaults
    answer: (a) take BOOT-06's extension (rule change BOOT-06 approved as worded, Jeff, r1)
  - id: a8
    kind: assumed
    status: confirmed
    question: BOOT-07's bootstrap surface list (Decision 10; rule change BOOT-07).
    options:
      - add tools/relay-vm/, tools/build-vm/, cmd/relay/dhcp*.go and driver/hyperv/relayseed*.go to the surface in bootstrap.md and tools/tier1/rules.yaml here
      - leave it to a process item
    recommended: take it here
    answer: (a) take BOOT-07's surface list (rule change BOOT-07 approved as worded, Jeff, r1)
  - id: a9
    kind: assumed
    status: confirmed
    question: Seams, relationships and validation (front-matter).
    options:
      - seams [bootstrap-model], alters_relationships true, security_boundary env-relay, windows-hyperv blocking, qemu-any and macos-qemu tracked
      - the same plus relay-claim, conservatively, although the wire is unchanged
    recommended: seams [bootstrap-model], alters_relationships true, env-relay, windows-hyperv blocking, qemu-any and macos-qemu tracked
    answer: (a) as drafted (Jeff, r1)
