source: 'native driver-contract-runtime-check-finch on main c52926df (host:macos-finch/macbook.20261123T220740Z): finch v1.19.0 starts a stopped VM on ''finch version'' and exits 0 after ~11.8 s, so warden build --runtime finch and warden doctor kill the query at 10 s, report ''`finch version` failed'', and leave the VM starting (Running afterwards); the next build passes. The design''s premise that ''finch version'' exits non-zero with the VM stopped does not hold. Logs: native/macos-finch/2026-11-23/runtime-check.log Jeff''s decision (2026-11-23, attended macbook session): the check uses `finch vm status` as its confirmation that the finch binary works and the VM is available, in place of `finch version`. A VM that is not running is started only when the run is attended (a person at a terminal), with the start shown; unattended, warden refuses up front with the fixable error and the `finch vm start` hint, as today.'
