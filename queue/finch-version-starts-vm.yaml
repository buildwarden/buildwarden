questions:
  - id: a1
    kind: assumed
    status: open
    question: 'Flagged: it defines Jeff''s "attended" (2026-11-23) for the first time, and option B is a change to the driver-contract seam. A run is attended when the container driver has a controlling terminal (design Decision 3): /dev/tty (macOS, Linux) or CONIN$ (Windows) opens; warden passes nothing, no setting. warden runs the driver with pipes for its standard streams, so the driver cannot test them itself.'
    options:
      - '(A) as stated: the driver''s controlling terminal, no seam change'
      - '(B) warden tests its own stdin and stderr with isatty and passes attended in run''s request: a change to specs/driver-contract/v1.md'
      - (C) an explicit setting, [driver.container] start_vm
    recommended: (A) as stated
  - id: a2
    kind: assumed
    status: open
    question: 'Linux finch keeps `finch version` (design Decision 2): by runtime.GOOS, Linux finch, which has no VM and no vm command, is checked with its version query as on main and never started; macOS and Windows use finch vm status. No fallback from vm status to finch version.'
    options:
      - (A) as stated
      - (B) vm status on every host, falling back to finch version when it fails
    recommended: (A) as stated
  - id: a3
    kind: assumed
    status: open
    question: 'warden doctor never starts finch''s VM (design Decision 6): it reports a stopped finch as blocked with the start hint, attended or not; Jeff''s "the run" is read as a build or shell, and doctor is a check (UX-04).'
    options:
      - (A) as stated
      - (B) doctor at a terminal starts it as a build does
    recommended: (A) as stated
  - id: a4
    kind: assumed
    status: open
    question: 'Flagged: departs from driver-contract Decision 26 (Jeff, 2026-11-22: the probe makes no engine call; an engine that is down fails at the build''s first call, leaving the output directory) for finch, on a reading of Jeff''s 2026-11-23 "refuses up front". The unattended refusal of a stopped finch is in the probe of run, before any output directory; the attended start is in run, outside the probe''s 30 s limit (design Decision 4).'
    options:
      - '(A) as stated: refuse in the probe, start in run'
      - '(B) Decision 26''s placement: the probe asks nothing; run''s first engine call refuses or starts, leaving the output directory'
    recommended: (A) as stated
  - id: a5
    kind: assumed
    status: open
    question: Detection with nothing named passes a stopped finch over like any runtime that is down, and an attended build starts finch's VM only when no runtime is up and finch is installed with its VM Stopped (design Decision 7).
    options:
      - (A) as stated
      - '(B) finch first means finch: an attended build starts its VM even when podman or docker is up'
      - (C) detection never starts a VM; only a named finch is started
    recommended: (A) as stated
  - id: a6
    kind: assumed
    status: open
    question: 'The attended `finch vm start` has no time limit of its own (design Decision 4): the person at the terminal sees its output and can interrupt it.'
    options:
      - (A) as stated
      - (B) a limit such as 120 s, a new default with no override
    recommended: (A) as stated
