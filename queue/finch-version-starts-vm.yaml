      claimed_by: ""
      expires: null
    note: 'Blocking native validation (design Validation plan; FLOW-09), on the branch after consolidation, on macOS with finch v1.19.0 or later. (1) VM Running: finch vm status prints Running (record exit code and time); warden doctor --runtime finch and warden doctor print container runtime: finch and ok; a default build succeeds and its ledger verifies. (2) finch vm stop; finch vm status prints Stopped (exit code, time); run it three times, the VM is still Stopped. (3) Unattended (the session''s own shell; record that /dev/tty does not open): with the VM stopped, time warden build --runtime finch is refused within 2 s with "container runtime finch is installed but its VM is not running (`finch vm status`: Stopped)" and the finch vm start hint, leaves no output directory, and the VM is still Stopped; the same with nothing named. (4) VM stopped: time warden doctor --runtime finch and time warden doctor are each blocked within 2 s naming the state, exit 1 with no ok, VM still Stopped; the same under script -q /dev/null (a controlling terminal): doctor does not start it. (5) Attended, simulated with script -q /dev/null dist/warden build --runtime finch ... (or by Jeff at a terminal if the session cannot run script): with the VM stopped, the build prints the start line and finch''s output, the VM is Running, and the build succeeds and verifies; the same with nothing named. (6) go test ./driver/container/... passes on macOS. Do not run finch vm remove or finch vm init. Leave the VM Running, as found. Evidence under native/macos-finch/<date>/.'
