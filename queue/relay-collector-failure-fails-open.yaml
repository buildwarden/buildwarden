questions:
  - id: a1
    kind: assumed
    status: open
    question: The status the relay answers when the collector fails to serve build-script, bootstrap or a cwd path (a non-200, non-404 reply, a failed request, or a 200 body cut short). Design, Decision 1 and Questions a1.
    options:
      - (a) 502 for all three, with a fixed body naming the input and the reason; nothing recorded
      - (b) 500, as GUEST-29's storage error
      - (c) 503
      - (d) the collector's own status passed through, 502 for unreachable
    recommended: '(a): the relay is the gateway to the collector for these inputs, as it is to the upstream in GUEST-46; 503 invites a retry this item does not add'
  - id: a2
    kind: assumed
    status: open
    question: What counts as not there on cwd. Today any non-200 from the collector is 404, as GUEST-34 states. Design, Decision 2 and Questions a2.
    options:
      - (a) only the collector's 404 is 404; any other non-200, its 403 included, is 502
      - (b) the collector's 403 passed through as 403, every other failure 502
      - (c) cwd left as is; only build-script and bootstrap fixed
    recommended: '(a): one meaning per status; the relay refuses an unsafe path itself (GUEST-33), so a collector 403 is a disagreement, not an absence; (c) leaves a build script''s own cwd reads failing open'
  - id: a3
    kind: assumed
    status: open
    question: 'alters_relationships: false. FLOW-02 lists a versioned seam among what alters relationships; here the seam''s requirements change but no role or interaction does (one reply for one failure). relay-leaf-crl changed the same seam under false. Design, Questions a3.'
    options:
      - (a) false
      - (b) true, conservatively, taking an alters_relationships slot at Plan's claim (limit 3)
    recommended: (a)
  - id: a4
    kind: assumed
    status: open
    question: The release numbers of the two changed specifications in buildwarden-specs. Design, Decision 7 and Questions a4.
    options:
      - (a) relay-guest-api/v0.2.0 and bootstrap-config/v0.2.0
      - (b) v0.1.1 for both, as a defect fix
      - (c) fold into the next release another item makes
    recommended: '(a): a requirement a v0.1.0 relay meets (BOOTCFG-3) is now failed, an incompatible change; (c) holds a security fix for an unscheduled release. No other specification or the harness is released'
  - id: a5
    kind: assumed
    status: open
    question: 'No executor code change: tests only under cmd/warden-io, since BOOTCFG-11 already stops the executor on a 502 and initialize.go and main.go are in the executor-initialize seam''s code list. Design, Decision 5 and Questions a5.'
    options:
      - (a) tests only; the executor-initialize pin does not move
      - (b) also print the relay's reply body in the executor's error, which needs an executor-initialize release with no spec change, or a Tier1-Allow trailer
    recommended: (a)
  - id: a6
    kind: assumed
    status: open
    question: 'The order with driver-contract (K1: undeclared areas, so it collides with this item; its r3 amends TEST-05 and PROFILE-01 to one pin module tools/conformance/go.mod) and workdir-in-context (near: driver-core reaches relay and executor). Design, Questions a6.'
    options:
      - (a) no order beyond FLOW-05's; whichever of this item and K1 merges second reconciles the pin in its refresh
      - (b) wait for K1
      - (c) ask Jeff to name a collides_with with workdir-in-context
    recommended: '(a): small, ahead of K1 (78 against 72), a security fix; the PR slot keeps related PRs apart, and near is already covered'
  - id: a7
    kind: assumed
    status: open
    question: tools/tier1/rules.yaml's relay-guest-api code list lacks relay/relay.go, which holds every artifacts and cwd handler, so the seam-contract check does not see this change. Design, Questions a7.
    options:
      - (a) leave the list; Jeff files adding relay/relay.go as its own item if wanted
      - (b) a GLOBAL-08 rule_changes entry here on tools/tier1/rules.yaml, adding the tier1-config area
    recommended: '(a): it is an enforcement change, and would make every later relay.go edit move a pin; this item moves the pin anyway'
