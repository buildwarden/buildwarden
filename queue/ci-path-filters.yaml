questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: Mechanism - a changes job with per-job if and a ci-ok gate job, rather than workflow-level paths-ignore? (No branch protection is configured by this feature; ci-ok is the check to require later.)
    options:
      - changes job, per-job if, ci-ok gate job
      - workflow-level paths-ignore on main.yml
      - a separate docs workflow plus paths-ignore
    recommended: changes job, per-job if, ci-ok gate job
    answer: Confirmed as recommended at design review r1
  - id: a2
    kind: assumed
    status: confirmed
    question: Path classes - docs-only is docs/** and top-level *.md, with docs/development/** still running test and tier1-test (TestRealIndex reads it); everything else runs the full set?
    options:
      - docs/** and root *.md docs-only, docs/development/** still runs Go tests
      - docs/** fully docs-only, relying on tier1's rule self-check
      - reuse tier1's not_code list
    recommended: docs/** and root *.md docs-only, docs/development/** still runs Go tests
    answer: Confirmed as recommended at design review r1
  - id: a3
    kind: assumed
    status: confirmed
    question: Run the tier1 job on every PR, not only on docs/design/** or code changes?
    options:
      - every PR
      - only docs/design/** or code changes
    recommended: every PR
    answer: Confirmed as recommended at design review r1
  - id: a4
    kind: assumed
    status: confirmed
    question: Classify with an inline shell step over git diff --no-renames HEAD^1 HEAD on the merge commit, fail-open to the full set?
    options:
      - inline shell, fail-open
      - dorny/paths-filter pinned to a commit
      - a tools/tier1 subcommand
    recommended: inline shell, fail-open
    answer: Confirmed as recommended at design review r1
  - id: a5
    kind: assumed
    status: confirmed
    question: Push to main and every non-PR event run the full set, unfiltered?
    options:
      - non-PR events run everything
      - filter pushes against github.event.before too
    recommended: non-PR events run everything
    answer: Confirmed as recommended at design review r1
  - id: a6
    kind: assumed
    status: confirmed
    question: Leave integration.yml and its workflow-level paths filter unchanged?
    options:
      - unchanged
      - move its filter into the changes job as a main.yml job
    recommended: unchanged
    answer: Confirmed as recommended at design review r1
  - id: a7
    kind: assumed
    status: confirmed
    question: Add a build-only mdbook job in main.yml for PRs touching docs/book/**?
    options:
      - build-only book job in main.yml
      - pull_request trigger on docs.yml
      - none
    recommended: build-only book job in main.yml
    answer: Confirmed as recommended at design review r1
  - id: a8
    kind: assumed
    status: confirmed
    question: TEST-01/TEST-02 say tier 0 runs on every PR - land this against the current text (every change that can affect the gate) and propose the rewording in the PR description for a process item, rather than wait for the rule change first?
    options:
      - land now, propose rewording for a process item
      - hold until a process item rewords TEST-01/TEST-02
    recommended: land now, propose rewording for a process item
    answer: Confirmed as recommended at design review r1
