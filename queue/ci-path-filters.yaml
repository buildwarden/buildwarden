feature: ci-path-filters
title: CI runs only the checks a change's paths need (docs-only PRs skip Go lint, test, tidy and build)
priority: 11
status: in_progress
round: feature
phase: 6
design: docs/design/ci-path-filters.md
branch: feat/ci-path-filters
alters_relationships: false
design_review: required
source: 'Jeff, 2026-10-30: docs-only updates should skip the testing rounds since there are no code changes'
steps:
  - id: f0-branch-setup
    phase: 0
    affinity: cloud
    status: done
    lease:
      claimed_by: ""
      expires: null
    note: 'Starting points for Design (intake, 2026-10-30). (1) Mechanism: workflow-level on.pull_request.paths-ignore is simplest, but a skipped workflow reports no status, so if main ever gets required checks those PRs hang on pending; a changes job (dorny/paths-filter, or git diff against the base) with per-job if: makes jobs report skipped, which satisfies required checks. main has no branch protection today (checked 2026-10-30). (2) Classify paths conservatively: only docs/** and top-level *.md as docs-only at first; .claude/**, tools/workflow/** and .github/** are not docs; go.mod/go.sum, Makefile and .golangci.yml always run everything. (3) Always-run checks: flow18.yml (sessions-private) on every PR; CodeQL is default setup and is not path-filtered. Pushes to main and tags keep the full set. (4) Overlap: tier1-static-checks (a4) adds a main.yml job that validates design front-matter, which docs-only PRs DO need, so the filter must keep that job for docs/design/**; agree the job layout with that feature. (5) Docs-only PRs could gain a mdbook build of docs/book (docs.yml builds only on push to main today).'
