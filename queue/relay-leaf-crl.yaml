questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: Record each CRL fetch in the ledger (RELAY-02), as /bootstrap is, rather than serving it unrecorded as /ca.pem is? (design now serves it unrecorded, per Jeff)
    options:
      - record it
      - serve it unrecorded like /ca.pem
    recommended: record it
    answer: 'Serve it unrecorded, like /ca.pem. Jeff (in chat, 2026-10-30): serving the blank revocation list should be considered a relay internal artifact, not something relevant to the actual inputs, since it should not affect the build outputs in a meaningful way.'
  - id: a2
    kind: assumed
    status: open
    question: http://artifacts/ca.crl as the distribution point, rather than a new reserved hostname or a path under cwd?
    options:
      - http://artifacts/ca.crl
      - a new reserved hostname
      - a path under cwd
    recommended: http://artifacts/ca.crl
  - id: a3
    kind: assumed
    status: open
    question: Leave the existing --ssl-no-revoke in the native diagnostic scripts on the workflow branch, and validate with a build script that uses no revocation flag?
    options:
      - yes, leave them
      - edit them to drop the flag
    recommended: yes, leave them
