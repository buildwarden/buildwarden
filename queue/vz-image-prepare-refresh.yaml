    event: 'f2-plan finding (back-to-design, FLOW-06), design as approved at f764e9f (branch 75f2243, impact fields and rule_changes unchanged; no plan committed): (1) the out-of-date warning''s condition contradicts the Validation plan. Decision 3 and the prepare pseudocode warn only when no prepared macos-<shortHash(latest)> exists; native case 3 expects the warning naming 27.0.1, 27.2 and --update with macos-90a1 active while macos-a139 (27.2) is prepared, and Tier-2 gaps (none) rests on case 3 staging the positive case. Design picks one: warn whenever the active image is not the latest IPSW''s (case 3 stands; a1''s answer reads this way), or only when the latest has no prepared image (case 3 drops its warning line and the positive case becomes a tier-2 gap or a staged case, e.g. after moving macos-a139 aside). Planning cannot pick: the tier-0 warning tests and the f6 case follow it. (2) A bare local IPSW path cannot be restored: classify has an ipsw-file kind and Decision 6 says a local IPSW source is never deleted, but RestoreIPSW, which the design keeps unchanged, hands the source to curl (ensureIPSWDownloaded), which refuses a path with "URL rejected: No host part"; only file:// works, and the help text and cli.md already promise "a local path". Design says whether restore uses a local IPSW in place (a change to RestoreIPSW) or a bare path refreshes only an already-prepared key and is otherwise refused with a fix (file:// or a URL). Also for Design: the f6-validate-macos-vz note predates the r1 fold-in (case 5 says "prepare --driver vz latest"; no IPSW deletion, out-of-date warning or --update refusals); bring it in line with the Validation plan.'
