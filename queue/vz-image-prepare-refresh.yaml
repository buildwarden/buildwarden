    note: 'Blocking native validation (FLOW-09) per docs/design/vz-image-prepare-refresh.md Validation plan, on the Apple-silicon Mac whose cache holds macos-90a1b1f94f64b00a (27.0.1, unstamped), macos-a139c218a2010753 (27.2, stamped) and both IPSWs with no active file: (1) a build with no --image uses macos-a139 (newest .prepared), image list marks it active and lists macos-90a1 as older with its IPSW name, doctor --driver vz reports macos-a139''s stamp; (2) sudo warden image prepare --driver vz with no source refreshes macos-a139 in place (no IPSW download or restore), writes active owned by the user, and a build with no --image succeeds with a verifying ledger; (3) prepare with the macos-90a1 directory as source refreshes it in place, stamps it and makes it active, and a build with no --image boots 27.0.1 with a verifying ledger; (4) with macos-90a1 active, --image macos-a139/disk.img after removing its link-channel is refused naming sudo warden image prepare --driver vz <macos-a139 dir>, and running that fixes the build and makes it active; (5) prepare --driver vz latest with 27.2 already prepared refreshes macos-a139 in place with no download; (6) offline, prepare with no source still refreshes the active image and prints no newer-IPSW notice or error. Reaches driver/vz only (image selection, refresh in place, prepare source handling).'
