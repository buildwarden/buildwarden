    kind: assumed
    status: confirmed
    question: The contract's time limits and cleanup points.
    options:
      - describe answers within 10 s and a probe within 30 s (a probe of run makes the driver's preflight); after stop, warden waits 60 s for a driver binary to tear down, then kills it and runs reap; a build may still complete for 10 s after the driver reports its environment exited; warden runs reap after a driver that ended without stopped or failed; warden clean runs it for every build of the selected driver whose lock nobody holds, on the binary and with the values in that build's record, and removes the lock only when reap succeeds; no sweep before each build; none is configurable. When both warden and the driver are killed, what the runtime or hypervisor holds keeps running until warden clean, as after a killed warden today. Whether 60 s covers a Hyper-V teardown is measured in native validation; the limit applies only to a driver binary, so K1 does not enforce it on Hyper-V
