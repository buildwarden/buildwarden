    question: 'The behaviour K1 changes (design, Behaviour): (1) flags and help follow the selected driver; (2) a flag the selected driver does not declare is refused, where eleven were silently ignored, and so is --runtime on a command that selects no driver; (3) the existing refusals take one generated form; (4) "unknown driver" becomes "driver not found", with what was searched, and a project file naming a driver that is not bundled is refused; (5) warden clean --driver qemu|vz no longer runs the container cleanup; (6) warden clean first cleans up after dead builds of the selected driver (reap from the build''s record, the stage directory, the lock); (7) a build may complete up to 10 s after its environment exits on every driver (5 s on container and Hyper-V today); (8) a second Ctrl-C kills a driver binary and reaps, where it killed warden, and on linked qemu and firecracker it now ends warden, where it was ignored (qemu''s VMs can then be left running until K2); (9) SIGTERM tears the build down on every driver and exits 1, where it killed warden on container, vz and hyperv; (10) the output directory gains driver.json, written with inputs/ before the driver starts; (11) warden driver list is new; (12) --driver and WARDEN_DRIVER accept a path; (13) a malformed [vm] image_refresh_after or image_min_grace is refused only when qemu or hyperv is selected, and then on every command; (14) --timeout counts from the moment warden starts the driver; (15) a context, output or temporary path that is not valid UTF-8 is refused for a driver binary.'
    options:
