questions:
  - id: a16
    kind: assumed
    status: confirmed
    question: 'Lookup and trust: how warden finds a driver binary. Jeff''s note: found "in the same way git finds its individual subcommands (i.e. existing on PATH)".'
    options:
      - a path in --driver or WARDEN_DRIVER (used exclusively); else a linked driver; else warden's own directory; else each absolute PATH entry; the five bundled names never from PATH; a project's warden.toml may select only a bundled driver, and no config file a path; no batch files on Windows; no auto-detection of the driver. On Unix the file found must be owned by root, the user or the owner of the warden executable and not be writable by group or others; a file in warden's own directory is held to warden's own owner and mode instead; for a PATH hit the directory must not be writable by group or others either
      - 'PATH only, as Jeff''s note described: a planted bundled name wins, and sudo warden does not find a driver installed beside it'
      - as the first option, and PATH is not searched at all when warden runs as root
      - 'as the first option, without the rule on the project file: a warden.toml in the working directory can then make warden run any warden-driver-<x> on PATH, on --help too'
    recommended: the first option
    answer: 'Changed, in Jeff''s words: ''This is overcontrolled. The nicety of this is for UX functionality and given this is never outside of the user''s control (i.e. never a part of the build environment), I''d say let''s allow for the first option with way less guarding around its official drivers, allowing for both customized implementations of existing drivers and new ones, either by absolute or PATH search''. Follow-ups, asked on their own: (1) when a name is both bundled and on PATH, PATH wins: a warden-driver-<name> earlier on PATH replaces the bundled one; warden driver list and driver.json show which file ran. (2) One guard stays: a project''s warden.toml may name a driver, never a file path; a path comes from --driver, WARDEN_DRIVER or the user''s own config. No ownership or mode check, no bundled-only rule. Jeff, design review of the redraft, 2026-11-14.'
  - id: a15
    kind: assumed
    status: confirmed
    question: 'K1''s scope and done-when, against K2, K3 and S4. Jeff''s note: "each driver effectively being its own independent binary"; in K1 only the container driver is one.'
    options:
      - 'K1 delivers the specification, the suite, the kit, a fake, warden''s calling side for every command and the container driver as a binary; all five drivers move onto warden''s build sequence and the four VM drivers stay linked until K2. Done when an unmodified warden runs every command of the contract through a driver binary it was not built with (the fake, in CI on three platforms), the suite passes against the fake and warden-driver-container, cmd/warden names the VM drivers only in linked.go and their existing doctor, setup, image and clean code, and native validation passes on each blocking host. Not proved in K1: a VM driver as a separate process (teardown on end of input, reap, kill and process groups, the vz entitlement, the Hyper-V service), so contract version 1 may still change in K2. K2: each VM driver becomes a binary, linked.go goes, the specification and suite move to the specs repository, then modules. K3 keeps its row. S4 is absorbed, except the claim specification''s transport section and a claim endpoint that is not TCP. One item and one PR'
      - 'container only, the VM drivers untouched: macos-finch and container-any blocking and the three VM hosts not needed, but two build sequences in warden until K2 and no evidence that the sequence fits vz and Hyper-V'
      - 'all five as binaries now, with a Windows release target and the vz signing move: five native validations of new process boundaries in one PR'
      - as the first option, split into two items at the point the fake passes
      - 'as the first option, but the VM drivers'' flags and keys stay in cmd/warden until each becomes a binary: their doctor, setup, image and clean code is not touched twice, at the cost of two option paths in cmd/warden until K2, and Behaviour 1 to 3 and 13 arrive per driver in K2'
    recommended: the first option; the second is the fallback if K1 proves too large
    answer: '(a) Decision 14: only the container driver is a binary in K1; all five on warden''s one build sequence; the four VM drivers stay linked until K2. Jeff, design review of the redraft, 2026-11-14.'
  - id: a21
    kind: assumed
    status: confirmed
    question: 'Who reads the configuration? Jeff''s note: "a shared library (either inside the top-level warden or otherwise) that helps mediate pieces like configuration-parsing/reading".'
    options:
      - 'warden reads the files, the environment and the flags; a driver declares its options in describe and receives resolved values; the kit gives a Go driver the Option declaration and typed access to the values, and reads no file. Consequences: an option has one of seven scalar types, a driver has no configuration of a shape of its own, and warden runs describe before it parses flags'
      - 'the kit reads the configuration inside the driver''s process, and warden passes through the flags it does not know and the paths of the config files: a driver may then have configuration of any shape, but warden cannot draw help, refuse an unknown flag or check a value before slow work, tier 1 cannot read the surface, and a driver written without the kit re-implements the precedence'
    recommended: warden reads it
    answer: (b) The kit reads the configuration inside the driver's process; warden passes through the flags it does not know and the paths of the config files. This departs from the recommendation; Decision 7, Configuration, describe's options, the Behaviour list and the surface enforcement change are redrafted and put to Jeff again. Jeff, design review of the redraft, 2026-11-14.
  - id: a14
    kind: assumed
    status: confirmed
    question: One run process per build, or run-and-exit verbs? Jeff's note spoke of "commands"; ten of the eleven run once and exit.
    options:
      - one process per build that exchanges JSON messages with warden; its lifetime is the environment's, and the end of its input means tear down
      - 'create, start, state, stop verbs, each run once: nearer "commands", but vz needs a holder daemon (its VM lives inside the process that made it) and a killed warden leaves VMs running'
    recommended: one process per build
    answer: (a) One run process per build; the other commands run once and exit. Jeff, design review of the redraft, 2026-11-14.
  - id: a12
    kind: assumed
    status: confirmed
    question: Who starts the default collector? Jeff's note had the driver "instantiate an on-host endpoint that it wires in"; the basis adjusted that, and this asks for his word on the adjustment.
    options:
      - warden starts today's in-process collector, one per build with a fresh token; the driver starts none
      - 'the driver starts the collector: every driver, in any language, embeds or ships a collector, and warden needs a protocol to it for console output, status and the output directory'
    recommended: warden starts it
    answer: (a) warden starts the default collector, one per build with a fresh token; the driver starts none. Jeff, design review of the redraft, 2026-11-14.
  - id: a13
    kind: assumed
    status: confirmed
    question: Who sends the claim? The basis left it open, and said warden "hands the driver an endpoint and a token".
    options:
      - warden dials the claim endpoint the driver reports and sends the claim (today's code, no listener on the host); the driver is handed nothing about the collector, which is narrower than the basis; start reserves a collector field and claim.network is an enumeration, so a driver-sent claim stays addable
      - 'the driver sends the claim, given the collector''s endpoint and token: the default collector must then listen where the relay can reach it, which driver/session.go rules out on purpose (and firecracker''s relay cannot open a connection to the host), or the driver bridges the tunnel for the whole build'
    recommended: warden sends it
    answer: (a) warden dials the claim endpoint the driver reports and sends the claim; start keeps the reserved collector field. Jeff, design review of the redraft, 2026-11-14.
  - id: a22
    kind: assumed
    status: confirmed
    question: 'Where the pluggable collector is written down. Jeff''s second note describes a collector that may be "a pre-existing local or remote endpoint that abides by the same rules, using session tokens to separate builds and allowing for listening to the console output and status via websockets or similar". The basis puts it in "a later phase", but the umbrella has none: its Decision 8 keeps alternative collectors out of this program and "Later, not scheduled" names only "alternative collectors and a collector repository".'
    options:
      - K1 builds none of it and leaves it possible (design, The collector), and one clause is added to the umbrella's "Later, not scheduled" naming what Jeff described (design, Amendments, section C)
      - the same, and a queue item is filed for it now, on hold behind the freeze
      - record nothing outside this design
    recommended: the first option
    answer: (a) One clause added to the umbrella's 'Later, not scheduled'; nothing queued. Jeff, design review of the redraft, 2026-11-14.
  - id: a5
    kind: assumed
    status: confirmed
    question: 'The behaviour K1 changes (design, Behaviour). Derived again on 2026-11-14 after the answers to a16, a20 and a21, and once more after the answer to a4: none of the redraft''s fifteen goes; 1, 3, 4, 8, 10, 12 and 13 change; 16, 17 and 18 are new. (1) flags and help follow the selected driver, and the driver''s part of help comes from its describe (help for a driver that cannot be found or described prints warden''s part and a line saying so); (2) a flag that neither warden nor the selected driver declares is refused by warden as it parses, where eleven were silently ignored, and so is --runtime on a command that selects no driver and, under the container driver, on setup and image prepare, which that driver does not implement; (3) the three refusals that name another driver (--network is only used by --driver hyperv, --slots is only used by --driver hyperv and firecracker, --update is not supported for --driver <d> yet) become the one unknown-flag refusal, which names the selected driver only: warden no longer knows other drivers'' flags, so the hint is lost; (4) "unknown driver" becomes "driver not found", with where warden looked, and a warden.toml whose [runtime] driver is a path is refused, whether it is ./warden.toml or a file named with --config (it may name any driver); (5) warden clean --driver qemu|vz no longer runs the container cleanup; (6) warden clean first cleans up after dead builds of the selected driver (reap from the build''s record, the stage directory, the lock); (7) a build may complete up to 10 s after its environment exits on every driver (5 s on container and Hyper-V today); (8) a second Ctrl-C kills a driver binary and reaps, where it killed warden, and so does a teardown longer than the teardown wait (60 s unless set); a third, or a reap that outlasts the same wait, ends the reap and leaves the rest to warden clean; on linked qemu and firecracker it now ends warden, where it was ignored (qemu''s VMs can then be left running until K2); (9) SIGTERM tears the build down on every driver and exits 1, where it killed warden on container, vz and hyperv; (10) the output directory gains driver.json, written with inputs/ before the driver starts, which also says where the driver was found and which copies it shadowed; (11) warden driver list is new; (12) --driver and WARDEN_DRIVER accept a path; (13) a driver''s keys are read only by that driver and only when it is selected: a malformed [vm] image_refresh_after or image_min_grace (refused today on build and shell under every driver) and a wrong TOML type in any of the seven existing driver-owned keys (which fails the load today under every driver) are refused by the driver that owns the key, in its probe, and pass unseen under another driver; (14) --timeout counts from the moment warden starts the driver; (15) a context, output or temporary path that is not valid UTF-8 is refused for a driver binary; (16) a warden-driver-<name> earlier on PATH than the bundled copy (anywhere on PATH, when warden''s own directory is not on it) runs in place of the bundled driver of that name, with no line at build time (warden driver list and driver.json show it), and one reached through a relative PATH entry is an error that names the entry; (17) [build] teardown_timeout is new; (18) a driver''s keys live in [driver] (the common keys the contract names: image_refresh_after and image_min_grace) and [driver.<name>] (that driver''s overrides of those and its own keys), and the seven existing driver-owned keys are renamed into them: each old name is still read and means what it meant, each one a file sets prints one warning line per command naming the new key, a file that sets a key under both names is refused, and one driver can be given its own value of a common key; a config nobody edits resolves to the same values as today. What 18 does with the old names was asked on its own and answered (a25, (a)). Reworded on 2026-11-15 after the one-file decision (a25''s answer; design, Decision 23): still eighteen. 4 and 12 change: there is no user-level file, and no config file names a driver by path (a26''s second part), so 12 is the flag and the variable. If a26 is answered (ii) for the old names, 18 is rewritten to it. The list is against main as project-config-trust leaves it: that the user-level file is no longer read, and --config and WARDEN_CONFIG, are that item''s changes and are not counted here; nor is the container runtime''s limit to finch, docker and podman, which is runtime-cli-project-path''s and which K1 keeps under both names of the key.'
