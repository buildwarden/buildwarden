e named with --config alike, and a path comes from --driver or WARDEN_DRIVER; one rule for every file, which agrees with that item''s Decision 7 and with what Jeff chose for the container runtime ("from every source"), and warden need not know how the file was found; an executor who wants a driver by path every time exports WARDEN_DRIVER or puts the file on PATH; it gives up a path in the executor''s own file, which the design at 5808805 allowed in the user''s. (B) A path is refused in the defaulted ./warden.toml and accepted, when absolute, in a file named with --config or WARDEN_CONFIG: the named file stands where the user''s config stood, which is the nearest to a16''s answer as given; it is also what that item''s Decision 7 rejects for the keys it covers, as "a second level by another name", so the two designs would treat a defaulted file differently; and --config ./warden.toml in a cloned repository turns the guard off, by the executor''s own act. (C) No guard: a path is accepted in any config file, as every other key of the file is under that item''s Decision 7; cd repo && warden build then runs a binary that the repository''s warden.toml names, at once and on --help too, which is what the guard was kept to prevent and the kind of hole runtime-cli-project-path closes. Recommended for the guard: (A); it and (C) are the two that treat every file alike, as that item proposes; of the two, (A) keeps the guard, and it can be widened later without breaking anyone, where (C) could not be narrowed. A letter by itself answers the old names only, and leaves (A) as a decision of the design, confirmed or not when the design is.'
