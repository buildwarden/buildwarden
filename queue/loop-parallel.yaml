questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: 'Disjoint PRs in one repository: in what order may they merge? (The proposal''s question 3.) CI does not run again when a PR''s base moves.'
    options:
      - '(a) Any order. main''s protection requires a pull request and green checks, not an up-to-date branch. What stands in for an up-to-date branch: QUEUE.md marks an open PR "behind main" (as current as the last wf stale: the daily tick, or the attended session, which runs it before it lists the PRs and after each merge made in it; a PR merged on GitHub between sessions shows its last green run and no mark); the tick and the attended session read CI on main, a red main opens Needs Jeff and its fix is filed as the follow-up of the item whose merge it was (FLOW-09, a16); and a PR merged while behind is still confirmed as merged (a14).'
      - '(b) An up-to-date branch is required: each merge blocks the rest until their refresh, about one merge per cloud run.'
      - (c) One open PR per repository.
    recommended: '(a): disjoint PRs share no exclusive area, and GitHub refuses a merge that conflicts in a shared file; what it accepts is a break between two disjoint items that neither branch shows alone, which lands on main and is fixed there (design: Safety)'
    answer: '(b) An up-to-date branch is required before a merge. Departs from the recommendation (any order): each merge blocks the rest until a refresh has run; the design is revised. Jeff, design review, 2026-11-14.'
  - id: a2
    kind: assumed
    status: confirmed
    question: What sharing only ordered areas costs (the book, build files, rule files, other items' designs). This departs from the proposal, whose section 1 put lightly shared files with "one PR at a time".
    options:
      - '(a) Nothing but the refresh: the two items are disjoint and both PRs may be open; the later one merges main at its refresh, where a conflict in the shared file is resolved.'
      - (b) They are near and take turns at the PR, as the proposal has it.
    recommended: '(a): measured on the 23 merges in history that were not loop work and changed fewer than 100 files (253 pairs), (a) gives 187 disjoint, 43 near, 23 colliding and (b) gives 151, 79, 23, so (b) makes 36 pairs (14%) take turns, Jeff''s own example among them when each item touches a book page. It changes nothing for the most recent work: among the last six product merges no pair is disjoint under either (8 colliding, 7 near), because each changed cmd/warden/ or a package every driver imports. The risk under (a) is a shared file that merges cleanly and wrongly; 14 of the 187 disjoint pairs changed a common file. The difference is one row of the relation table'
    answer: '(a) Sharing only ordered areas costs nothing but the refresh: the items are disjoint. Jeff, design review, 2026-11-14.'
  - id: a3
    kind: assumed
    status: confirmed
    question: A cap on work waiting for Jeff. (The proposal's question 5.)
    options:
      - (a) None. QUEUE.md opens Needs Jeff with the count of items waiting on him, by kind.
      - (b) No queued item starts while 8 or more wait on him.
    recommended: '(a): a cap would stop the loop on the one resource it cannot add to'
    answer: '(b) A cap: no queued item starts while 8 or more items wait on Jeff. Departs from the recommendation (no cap); the design is revised. Jeff, design review, 2026-11-14.'
  - id: a4
    kind: assumed
    status: confirmed
    question: Who declares areas, and where the map lives. (The proposal's question 6, with its letters.)
    options:
      - (a) Areas are proposed at intake with Jeff and confirmed by Design; a design that narrows what intake recorded cannot skip its review. A follow-up filed with nobody there (FLOW-09) takes the repositories and areas of the item it follows; its Design may add to them, and removing one needs the review.
      - '(b) Areas are declared by Design only. A follow-up is then undeclared until its design: it collides with every feature and may open its PR only when no other feature has one open, which makes the fix for a red main the slowest item in the queue.'
      - (c) The map is on the workflow branch, changed in an attended session on Jeff's word.
      - '(d) The map is on main at tools/tier1/areas.yaml, as the profile''s Areas entry (PROFILE-01): a feature changes it only as a rule change its design review approves by name, and tier 1 checks it against the tree. wf computes from a generated copy in the queue state.'
    recommended: (a) and (d)
    answer: '(a) and (c): areas are declared at intake with Jeff and confirmed by Design; the area map lives on the workflow branch and is changed in an attended session on his word. Departs from the recommendation on the map''s home (main, under FLOW-14); the design is revised. Jeff, design review, 2026-11-14.'
  - id: a5
    kind: assumed
    status: confirmed
    question: 'The map itself (design: The area map): 16 exclusive areas and 5 ordered ones. driver-core is one area, and holds the relay VM''s init and initramfs script (tools/relay-vm/), which driver code tests, writes for and copies; relay, relaycfg, ledger, collector and executor are five; cli (cmd/warden/) is exclusive; the book, docs/development/, the build files, other items'' designs and tier 1''s configuration are ordered.'
    options:
      - (a) As written.
      - '(b) Finer: the guest families (linuxguest, winguest) apart from driver-core, so more items are near and fewer collide.'
      - '(c) Coarser: rules.yaml''s shared list (relay, ledger, collector, relaycfg, bootstrap, driver/*.go) as one area.'
      - (d) cli ordered, so two driver items that each edit cmd/warden/ do not collide (five of the 52 merges changed it).
    recommended: (a)
    answer: (d) The map as written, with cli (cmd/warden) an ordered area, not exclusive. Departs from the recommendation; the map and the case table are revised. Jeff, design review, 2026-11-15.
  - id: a6
    kind: assumed
    status: confirmed
    question: Steps in a second repository. (The proposal's question 11.)
    options:
      - '(a) Allowed for a repository with no loop of its own, as seam-specs does: the item lists it in repos, its design says which invariants apply there (LOOP-08), and a human step records a merge there that wf cannot see. FLOW-04 and FLOW-08 gain the sentence seam-specs'' a15 asked for as an exception.'
      - (b) Only through a release (LOOP-07).
    recommended: (a)
    answer: (a) An item may have steps in a repository with no loop of its own; a human step records the merge there; FLOW-04 and FLOW-08 gain the sentence. Jeff, design review, 2026-11-15.
  - id: a7
    kind: assumed
    status: confirmed
    question: Whether a tracked item (one homed in another repository, with two human steps and no gate) counts in the limits.
    options:
      - (a) It is shown with its relations and neither holds nor waits; nothing is enforced for it until loop-repository gives its work steps and gates.
      - (b) It counts like any feature, on the state the human enters.
    recommended: '(a): what wf counted would rest on state entered by hand, and a stale entry would hold real work'
    answer: (a) A tracked item is shown with its relations; it neither holds nor waits. Jeff, design review, 2026-11-15.
  - id: a8
    kind: assumed
    status: confirmed
    question: A reconciliation item's mark, its wait and its place. That it is a feature in FLOW-05's class 3 is decided (loop-contract a5).
    options:
      - '(a) Marked by adopts: {consumable, version}. Filed on hold with a blocking question that names the release when the release does not exist yet (LOOP-04), answered by Jeff or an attended session when it does. Intake places it below the open fixes; a regression''s fix still goes to the top.'
      - (b) As (a), placed at the top of the fixes.
      - '(c) As (a), with no default place: Jeff says each time.'
    recommended: '(a): a regression means main is broken now; an adoption is planned work'
    answer: '(a) adopts: {consumable, version}; held by a blocking question naming the release; placed below the open fixes. Jeff, design review, 2026-11-15.'
  - id: a10
    kind: assumed
    status: confirmed
    question: 'The refresh, now that a PR may merge only when its branch contains main (a1 (b)): which PRs get one, its budget, and native validation. Reworded 2026-11-15: it was asked for a1 (a), where a refresh was a courtesy a merge did not wait for; it is now required before every merge after the first.'
    options:
      - '(a) Which PRs: every open PR that is behind main, whatever moved main, on every run. After a run each open PR is current, and he may merge any one of them.'
      - (b) Withdrawn. It was "only when a related item's PR merged"; under a1 (b) a PR left behind by an unrelated merge could then never merge.
      - '(g) Which PRs: only the first open PR in the merge order (FLOW-05), and any PR an attended session is asked to refresh. One PR is ready after each run; he merges that one, or asks for another.'
      - '(c) Budget: each refresh is a claim and counts one step against the item''s budget; intake''s size guide adds two steps for it.'
      - '(d) Budget: a refresh counts in the run''s budget and not against the item''s: other items'' merges make it necessary, and it is required before the merge. (Narrowed from the draft''s "spends no budget, like the merge confirmation", so a run''s budget still bounds the refreshes it takes.) Only the first claim of a refresh step is free for the item: one that is released and claimed again counts like any retried step, so a refresh that keeps failing still ends at the runaway check (FLOW-13).'
      - '(e) Native: a refresh does not queue a blocking native validation again: the validation stands for the branch as it was consolidated.'
      - '(f) Native: a refresh queues each done blocking host step again when the commits it merged changed a file this branch also changes, or a file in an area one of its areas reaches. The PR is then not ready until that host has run: one merge per cloud run and native session for such a PR.'
    recommended: '(a), (d) and (e). With five PRs open and one merged a day, (a) costs 4 + 3 + 2 + 1 = 10 refreshes over four runs, four of them on the last PR, and (g) costs four, one per PR; either way the five merges take five days unattended, or one attended sitting with four refreshes. In general, with n PRs open, (a) costs n(n-1)/2 refreshes and (g) n-1. Nothing caps n: the waiting limit (a3) stops new starts, not work in progress, so more than 8 PRs can be open; what bounds a day''s refreshes is the run''s budget of 24 steps. (a) costs more and is recommended all the same: after every run each open PR has been checked against the main it will merge into, so one that conflicts is sent back that day and not when its turn comes, and the order of merging stays his. On the budget the recommendation changes from the draft''s (c) to (d): under (c) the fifth PR spends four steps on refreshes; an item that trips its runaway check that way gets no further step, its refresh included, until he raises its estimate. Under either, no refresh is taken while main is recorded red, except the refresh of the item that fixes it (design: main''s CI): a refresh onto a red main fails on main''s failure and is released, and a released step is the first one wf next offers again, so without that refusal one refresh could take a whole run''s steps ahead of the fix. Its cost: a red main whose failure the gates would not reproduce (a test that fails one run in several, a job that runs only on main) also holds every refresh until its checks are run again and pass, or the fix merges. Under (e) a break that only a native host shows is found by the matrix before a release (TEST-02); with cli ordered (a5 (d)) a Hyper-V item can merge another item''s cmd/warden change at its refresh with no Hyper-V run on the result, and (f) closes that at its price'
    answer: '(a), (d) and (e), as recommended: every open PR behind main is refreshed every run; a refresh''s first claim counts in the run''s budget, not the item''s; a refresh does not queue a blocking native validation again. Answered 2026-11-15, second sitting.'
  - id: a12
    kind: assumed
    status: confirmed
    question: Who gets a free PR slot when related items wait.
    options:
      - '(a) The higher priority, whether or not it could take the slot at that moment: an item is refused while a related item of higher priority waits (the proposal''s rule). A lower-priority item can then wait for a holder it is disjoint from, because the item ahead of it does.'
      - '(b) The higher priority only when it could take the slot itself (the first draft). More PRs are open at once, and a high-priority item related to two streams that are disjoint from each other can wait without end: a driver-core item behind alternating Hyper-V and VZ items.'
      - (c) The first to ask.
    recommended: '(a): it matters once a second worker exists (an attended run on a named item today, a machine''s led item after loop-native-lead)'
    answer: (a) The higher priority goes first, whether or not it could take the slot now. Jeff, design review, 2026-11-15.
  - id: a13
    kind: assumed
    status: confirmed
    question: Whether this item holds a worker while it is implemented, merged and closed.
    options:
      - '(a) None. Two things are handled without a hold: a session whose dist/wf predates the merge drops a new field when it saves a queue file that carries one, so the first new field is written only after no lease predates the merge, and every scheduled session rebuilds wf as it starts; and seam-specs and driver-contract, which finished Design before the queue could record what they declare, are not compared with their designs at any gate until a human wf declare records them (the attended step x4-state).'
      - '(b) holds: [cloud, host:*], set by hand for the day of the merge and Close and removed after.'
    recommended: '(a): a hold lasts while the item is in progress, days during which S1 and K1 would stop'
    answer: (a) The item holds no worker. Jeff, design review, 2026-11-15.
  - id: a14
    kind: assumed
    status: confirmed
    question: 'The merge check, now that a PR merges only with main in its branch (a1 (b)). Reworded 2026-11-15: it was asked for a PR merged behind main. wf confirms a squash merge, for each ref of the branch that still exists, by ancestry, an equal tree, or an equal patch-id computed with three lines of context (wf-squash-after-base-moved, whose a3 said to change this "if adjacent-edit escalations show up in practice"). The head that merges now contains main, so the tree proof confirms every ref at that head. The patch-id proof is still reached, and still fails beside an adjacent edit, in two cases: (1) a ref older than the head that merged, in a checkout that held the branch before its last refresh (an attended worktree, a native machine, Jeff''s clone), which is ordinary now that every PR after the first is refreshed before it merges; it matters at Close (FLOW-16) and to wf stale run in that checkout; (2) a merge made round the up-to-date requirement, before the ruleset exists or by his bypass.'
    options:
      - '(a) Zero context (-U0), that design''s option (b): the proof becomes "the same lines added and removed in each file, in order". It covers both cases when the refresh merged cleanly; after a refresh that resolved a conflict an older ref has no proof, and a human compares, as today.'
      - '(b) Keep three lines: through the protected path the tick confirms the merge by the tree; each older ref beside an adjacent edit fails, Close leaves that branch and FLOW-16''s escalation gives Jeff the commands; a merge made round the requirement fails wherever the ref exists, and the item keeps the PR slot until he compares the two changes by hand.'
      - (c) Keep three lines, and confirm an older ref as an ancestor of the head that merged, which GitHub keeps as refs/pull/<n>/head after it deletes the branch. It weakens no comparison; it makes the check fetch a ref only GitHub has, where it needs no network today, and it does not cover case 2.
    recommended: '(a), for a different reason than the draft''s: merging behind main is now the exception, and a ref older than the last refresh is the rule. The change is one flag. Case 2 was reproduced for the draft (A edits line 5, B line 8, B is squashed after A), and case 1 on 2026-11-15 in a scratch repository: the refreshed head has the squash''s tree, and B''s ref from before the refresh has a change that differs from the squash''s with three lines of context and equals it with none'
    answer: (a) Zero context (-U0), as recommended. Answered 2026-11-15, second sitting.
  - id: a15
    kind: assumed
    status: confirmed
    question: 'Whether the areas that hold the checks reach every area. The proposal has "tier1, rules and tier1-config reach every area: a tightened check meets all code". The first draft dropped it for the import graph alone, on the ground that make lint finds the failure at f6-merge-main or at the refresh; that does not hold under a1 (a), where a PR may merge before its refresh.'
    options:
      - '(a) The import graph alone: an item that tightens a check and an item whose code the check newly fails are disjoint, both PRs may be open and merge in either order, and the failure first shows on main.'
      - '(b) tier1 (the checks'' code) and tier1-config (rules.yaml, golangci.yml, the area map) reach every area: an item that changes either is near every item in the repository and takes turns at the PR with it. rules (docs/development/) does not: wording checks nothing mechanically, and 22 of the 52 merges changed it.'
      - '(c) As the proposal, rules too: nearly half of all items would take turns at the PR with every other item.'
    recommended: '(b): on history one of the 23 merges changed either area and 17 of the 253 pairs become near. It does not cover a whole-tree check that lives in a test of a code area (driver/buildlink/stray_test.go, specs/specs_test.go) or the root .golangci.yml; those are part of what a1 (a) accepts'
    answer: '(a) Import graph only: the areas that hold the checks do not reach every area; a tightened check and the code it fails are disjoint and meet on main. Departs from the recommendation (b); the design is revised. Jeff, design review, 2026-11-15.'
  - id: a16
    kind: assumed
    status: confirmed
    question: A regression that CI reports on main. FLOW-09 has a session file a regression main already has when it finds one "while the feature is built, validated or consolidated"; nothing files one that CI reports on main itself, and nothing in the loop reads that result today.
    options:
      - (a) The run that sees main red files the fix, unattended as FLOW-09 already allows, as the follow-up of the item whose pull request that merge was, at the top of the fixes; when the red commit is no item's, it files nothing and Needs Jeff says main is red. FLOW-09 gains two sentences.
      - '(b) It only reports: Needs Jeff opens with the red main, and the fix is filed when a later step''s gates meet the failure, as that step''s item''s follow-up (FLOW-09 as written), or by Jeff.'
    recommended: '(a): under a1 (a) a red main is the designed outcome of a missed collision, and every open PR''s refresh fails on it until a fix is filed'
    answer: (a) The run that sees a red main files the fix unattended, as the follow-up of the item whose merge it was, at the top of the fixes; nothing is filed when the merge was no item's. Jeff, design review, 2026-11-15.
  - id: a17
    kind: assumed
    status: confirmed
    question: 'What the cap of 8 (a3 (b)) counts, and what it never stops. New 2026-11-15: the answer to a3 sets the cap and its number and leaves these to the design (design: The waiting limit).'
    options:
      - '(a) It counts items in progress that wait on him, each once: a human step that is ready and of a phase the item has reached, an open blocking question, a PR at its merge step (ready, or waiting for its refresh), a spent budget. Queued items are not counted, even one on hold or one whose first step is his review, and neither is a tracked item, nor a human step of a later phase that wf offers early (this item''s x4-state, seam-specs'' f6-release-specs). It refuses only the start of a queued feature. It never refuses work in progress (so the count can pass 8), a process item, a tracked item, a fix that follows an item, or the fix main.yaml names for a red main, whether the tick filed it or he did at intake. Any other security fix that follows no item is not exempt: wf has no mark for it, intake tells him, and he raises limits.waiting_on_human if he wants it started.'
      - '(b) As (a), but every open item under Needs Jeff counts, queued ones included: 7 on the queue as it was at f090401 (2026-11-15 20:14 UTC) where (a) counts 4. Each idea filed on hold behind the freeze counts, and eight of them stop every start until he answers or drops one.'
      - '(c) As (a), with no exemption for a fix: while main is red no open PR can be refreshed (a1 (b)), so with 8 waiting he could not clear one by merging, and the fix for main would wait on him clearing something else.'
      - '(d) As (a), with a mark he sets at intake for a security fix that follows no item (wf new -urgent), which the cap then lets start: one more field. Two such fixes are in the queue: runtime-cli-project-path, in progress, and project-config-trust, queued at f090401 and in progress since 20:30 UTC that day.'
      - '(e) As (a), but a human step counts as soon as wf offers it, whatever its phase: x4-state then holds one of the 8 places from the day this item''s review is approved until its PR has merged, and f6-release-specs one from seam-specs'' review until its Publish.'
    recommended: '(a): the loop''s own lever is whether it starts new work, so that is what the cap moves; and a fix for main is what lets his list get shorter'
    answer: '(d): as (a), plus a mark set at intake (wf new -urgent) that lets a security fix that follows no item start past the cap. Answered 2026-11-15, second sitting. In the same sitting Jeff accepted two choices the design made without a question: no refresh is taken while main is recorded red, except for the item named as the fix (accepted with its cost: a failure the gates would not reproduce also holds every refresh); and a refresh is not exempt from a process item''s hold.'
  - id: a18
    kind: assumed
    status: confirmed
    question: 'Whether an ordered area has reaches: what an item that edits the CLI is to an item in a package the CLI imports. New 2026-11-15, raised by the independent review of the fold-in. His answer to a5 is about two items that both touch the CLI ("stay disjoint and take turns only through the refresh"); his answer to a15 is that reaches is the import graph. cmd/warden imports every driver and every shared package, so the two together do not say what an item that edits cmd/warden is to an item that does not and changes a package it imports. The fold-in settled that with a rule of its own (design: Decision 5): an ordered area reaches nothing and is reached by nothing.'
    options:
      - '(a) An ordered area has no reaches. An item that edits cmd/warden is disjoint from every item it shares no exclusive area with, whether or not that item edits the CLI too. On the 253 pairs of history: 197 disjoint, 34 near, 22 colliding. Ten pairs differ from cli exclusive, and in nine of them only one of the two merges touched cmd/warden (for example hyperv-ps-done, #116, beside vz-image-prepare-refresh, #108).'
      - '(b) cli keeps its imports as reaches, except between two items that both declare cli. Two items that both touch the CLI are disjoint, as his answer says; an item that touches it is near every item that does not and changes a package cmd/warden imports (a driver, driver-core, relay, relaycfg, ledger, collector, executor), and the two take turns at the PR. On history: 188 disjoint, 43 near, 22 colliding; only the one pair in which both merges touched cmd/warden differs from cli exclusive. The map''s format then allows reaches on an ordered area, and the relation''s row 9 gains the exception.'
    recommended: '(a). Under (b), adding cli to an item''s areas makes it less related to another item, not more: a Hyper-V item that adds a flag is near a vz item that adds none and disjoint from a vz item that adds one. And under a1 (b) the later of two such items merges main at its refresh and runs make lint and make test on the result before it can merge, so a CLI edit that no longer builds against a changed package fails there and not on main; where he wants two such items in turn, wf relate names the collision. Not offered: cli keeping its reaches between any two items (187, 44, 22), where the pair that both touch the CLI would be near, which his answer to a5 rules out'
    answer: (a) An ordered area has no reaches, as recommended. Answered 2026-11-15, second sitting.
  - id: a19
    kind: assumed
    status: open
    question: 'Whether the urgent mark (a17 (d)) is for security fixes only, and what holds it to them. New 2026-11-15, raised by the fold-in of a17 (d). His answer names the case ("a security fix following no item") and the mark (wf new -urgent, "one more field"). wf cannot tell a security fix from any other feature: the queue has no field for what an item fixes, and FLOW-20 leaves "a fix for a security problem" to intake and the design review to judge. So the fold-in had to say whose the mark is (design: The urgent mark).'
    options:
      - '(a) The mark is the human''s to use. wf checks who sets it, a human worker, and not what the item is. FLOW-05 says that a feature the human has marked urgent starts whatever the count, and names the security fix that follows no item as what the mark is for. Intake offers it for that case and for no other. Jeff may ask for it on any feature, and the attended session then sets it.'
      - '(b) Security fixes only, by the rule''s words. FLOW-05 says "a security fix the human has marked urgent". wf checks the same as under (a) and no more. Intake judges whether the item is a security fix, as it judges FLOW-20''s exemption, and an attended session declines the mark for anything else until a process item changes the rule.'
      - '(c) Security fixes only, held by wf: a second field that says the item is a security fix, set at intake, without which -urgent is refused. wf still takes the human''s word for the second field. Two fields, where his answer has one.'
    recommended: '(a). The cap is his instrument for his own attention, and the mark is the one exception to it that he grants item by item; a mark only he can set cannot be spent by the loop. Under (b) the next thing that cannot wait and is not a security fix (a fix for a fault a user reports, which follows no item and has not made main red) has no route but raising limits.waiting_on_human, which lets every queued feature start: the route his answer to a17 replaced. Under (a) the rule still says what the mark is for, so an agent has no ground to propose it for ordinary work'
