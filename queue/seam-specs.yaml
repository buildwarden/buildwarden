    question: 'The release step, and what it rests on (Decision 12; reworded 2026-11-14). After Review, Jeff merges the specs pull request (FLOW-08), a release is tagged and the pin moves to it. wf records one branch and one PR per item, in this repository, so it cannot see that merge. Two sentences of the rules as they stand do not provide for a queue step that waits for it: FLOW-04''s list of what a human step is for (blocking questions, the design review, escalations), and FLOW-08''s "There is no sign-off step in the queue: the loop sees the merge". The merge remains the sign-off; the step is only the queue''s record of a merge wf cannot see. A feature''s design may not declare a change to a loop rule (FLOW-14 as amended, LOOP-09), so neither is declared. LOOP-09, on main since 2026-11-15, gives every change to a loop rule to a process item and provides for no exception granted in a feature''s design review; whether an exception that the owner of the rules grants for one item is within it is his to judge at this review, and the options other than the first ask for none. LOOP-04, merged with it, holds an item that waits on another component''s release with a blocking question that names the release (FLOW-07), which is the second option''s mechanism. It does not bind here: the specs repository has not adopted the contract and is not a component (LOOP-08), and the release is this item''s own product, made by the merge of its own pull request there; what the queue lacks is a way to see that merge. The first option is still recommended, for two reasons neither rule answers: the step is in the queue from the design review, and the release can be made as soon as Review is done, before the item takes the PR slot (the second option raises its question in Publish, when the slot is held). If Jeff judges that the exception is not one to grant in a feature''s review, the second option is what the merged rules already provide for, and Design then removes f6-release-specs. loop-repository (P1) makes the step unnecessary: wf then records the specs PR and confirms its merge. If Jeff wants the rules to provide for such a step meanwhile, the FLOW-04 and FLOW-08 clauses are a process item''s: the design proposes loop-parallel (tracked items), loop-native-lead being the item that is to amend FLOW-04 (loop-parallel''s draft design, read at 486ac8f and not reviewed, proposes both clauses as its a6); holding a human step back until its phase is a wf and FLOW-04 change for the same item. Reworded again after the independent review. Citations brought up to the merged rules on 2026-11-15, with the sentence on LOOP-09; the sentences on LOOP-04 and on loop-parallel''s draft added the same day, on the independent review of that update; the options and the recommended answer are unchanged.'
    options:
