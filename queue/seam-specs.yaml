  - id: a19
    kind: assumed
    status: confirmed
    question: 'Where the code that every suite shares lives, and how it is versioned (design: Decisions 4 and 5; new 2026-11-15, raised by a8''s answer in the design review). With a tag per specification, the launchers, the sandbox, the target-file format, the runner and the test side of each protocol are used by all six suites and belong to no one specification; a relay cannot be tested on one seam without the others, so that code cannot be divided among the six.'
    options:
      - '(A) one more module in the specs repository, conformance/, tagged on its own (conformance/v0.x.y); each specification''s module names the harness version it is released with and its binaries are built with exactly that; a change that needs both is one pull request and one merge, the harness''s tag pushed first. Cost: a seventh version number (no implementation pins it), and in such a pull request a specification names a harness version with no tag yet, which Go does not build as it stands once the harness imports anything outside the standard library. Three pieces of machinery make it build, each tried in a model: a replace line in the workspace file that names the harness version in progress, edited each time it rises; a command that tidies each specification''s go.mod through a temporary replace, with a ci check that the result is complete; and a release built with go install <command>@<tag>, because a build in a checkout at the tag fails. An implementation''s branch in progress carries one replace line'
      - '(B) the same module, tagged, and released ahead: a harness change is merged and tagged in its own pull request before the specification that needs it; nothing names a version that does not exist, so none of (A)''s machinery is needed. Cost: two merges for every change that needs both, two pull requests for the first release, and a harness change is merged before an implementation has run against it'
      - '(C) the same module, never tagged: each specification''s go.mod names the commit of the harness it was written against; six tags, not seven. Cost: a released specification, and through it this repository''s main, names an unreleased commit (beside LOOP-07 point 5), and the specs repository must merge by merge commit'
      - '(D) one bw-conformance binary built from a module that requires all six specifications: one command for a user. Cost: its version is a set of six versions, the single tag under another name, and a specification''s release no longer carries the tooling that tests it'
