      - list them; every change to the relay's core then needs a pin move or a Tier1-Allow trailer saying why it is not a seam change
    recommended: 'leave them off: a change there needs no pin move; the pinned suite fails a change in behaviour a case tests, and an addition no case tests is caught only by Review''s judgment of GLOBAL-08'
  - id: a18
