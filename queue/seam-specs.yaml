      - 'no step: f6-open-pr opens the PR on the pseudo-version, the pin job fails, and FLOW-11''s escalation asks Jeff for the release'
      - S1 waits for loop-repository
    recommended: 'a human queue step f6-release-specs in phase 6, as an exception to those two sentences (FLOW-04''s list and FLOW-08''s "no sign-off step in the queue") that this review grants for this item only: Jeff merges the specs pull request (FLOW-08, his alone); the tag is then pushed and the pin moved on this branch (make pin-specs, make test, make lint, push) by him or by the attended session on his word; the step needs f2-design-review, is not to be done before Review is done (wf cannot hold a human step back until its phase), and the PR''s pin job is the backstop'
    answer: (A) A human step f6-release-specs, as an exception to FLOW-04's list and FLOW-08's sentence, granted by this review for this item only. Jeff, design review, 2026-11-15.
