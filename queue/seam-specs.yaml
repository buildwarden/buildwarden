    status: open
    question: 'Which relay files tier 1''s seam list names (design: Tier 1''s seam list; new 2026-11-14). relay/relay.go, relay/proxy.go and cmd/relay/ (all but dhcp.go) hold part of seams 1 and 3 together with most of the rest of the relay. Under either option the check asks only that the pin moved, to any release.'
    options:
