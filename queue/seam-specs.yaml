    note: 'Not before Review (phase 4) is done: wf offers this step once the design review is done, and cannot hold a human step back until its phase (design: Decision 12, How the loop treats the second repository; a15, a4, a8). It exists as an exception to FLOW-04''s list and to FLOW-08''s "no sign-off step in the queue" that the design review grants by confirming a15; if the review does not, Design removes it. It signs nothing off: the merge does (FLOW-08), and this step records it where wf cannot see it. First list the tier-2 report''s MUST findings that are in the specs repository in the specs pull request''s body, read them, and check that the latest conformance run on this branch is green and that each of the six pin modules (tools/conformance/<directory>/go.mod, a20) names the specs pull request''s head. Then, in buildwarden/buildwarden-specs: Jeff merges the pull request from feat/seam-specs into main (FLOW-08; no session merges it), preferably as a merge commit. The seven tags are then pushed on the merge commit, each tag in a push of its own (GitHub starts no workflow run for a push of more than three tags): conformance/v0.1.0 first, its release run green before the next, and then v0.1.0 of each specification (bootstrap-config, collector-inputs, collector-outputs, executor-initialize, relay-claim, relay-guest-api; a8, design: Decision 4). A release run that was missed or failed is started again by hand for the existing tag (workflow_dispatch); no tag is moved. Then on this branch: make pin-specs SPECS=latest, which writes each of the six pin modules again at its tag and drops its replace line (design: Decision 7), then make test, make lint, commit, push. If the module proxy does not list a tag yet, name the six instead of latest: make pin-specs SPECS="<directory>@v0.1.0 ..." with all six (plan: task 36). This is the first time a real tag is resolved through the proxy: if a pin cannot be resolved or built, no tag is moved, and the fault is fixed by a pull request in the specs repository and the next patch versions (design: Releases and how they are consumed). An attended session may push the tags and move the pins on Jeff''s word. Confirm that the specs branch was deleted on merge (FLOW-16) and name the specs pull request and the seven tags in this step''s evidence. If the specs pull request changed after Review, record the difference between the reviewed commit and the tagged commit there too. The step is done when the seven release runs are green, the six specifications'' with their binaries attached and the harness''s with none, and this branch''s conformance run on the six tags is green. After the releases, start the specs repository''s implementations workflow once by hand and name what it reported in the evidence; it does not gate this step (plan: tasks 33 and 36). The PR''s pin job fails a module whose pin is not a release tag or that carries a replace line, so f6-open-pr cannot go green without this step.'
