questions:
  - id: a1
    kind: assumed
    status: confirmed
    question: 'What may a project''s warden.toml set [runtime] cli to? The item''s source says a name looked up on PATH; the design finds that a name is not enough: cli = "sh" with a file named pull in the repository makes a release warden build run sh pull <relay image>, which executes ./pull on the host (checked with sh; warden clean runs ./container the same way).'
    options:
      - (a) exactly finch, docker or podman, the names warden probes for, or empty
      - (b) those three and nerdctl
      - (c) any name without a path separator, looked up on PATH, as the source words it; this leaves host execution open through any interpreter on PATH
      - '(d) nothing: the key is read from the user''s file only'
    recommended: (a) exactly finch, docker or podman, the names warden probes for, or empty
    answer: 'Changed, in Jeff''s words: ''If this is specifically for the container driver, then it should be limited to container-specific configuration which that driver should be limited to the runtimes it already knows it supports''. So the value is limited to the runtimes the container driver supports (finch, docker, podman). Whether that holds for every source or only for a project''s file is asked as a follow-up. Jeff, design review, 2026-11-15.'
  - id: a2
    kind: assumed
    status: confirmed
    question: When is a refused [runtime] cli from the project's warden.toml an error?
    options:
      - '(a) when it is the value in effect on a command that resolves the container runtime: build, shell and doctor with the container driver, and clean with every driver except firecracker and hyperv (so also warden clean --driver qemu and --driver vz, which run the runtime today); --runtime and WARDEN_CTR_CLI replace it without an error, so a repository whose file is refused can be built without editing it; K1 can keep this unchanged, but for clean under qemu and vz, which K1 stops running the runtime'
      - '(b) as the file loads: every command that loads configuration, every driver, even when a flag overrides it, as [vm] build_link is; the way out is to edit the repository''s warden.toml, and K1 narrows it again to when the container driver is selected'
    recommended: '(a) when it is the value in effect on a command that resolves the container runtime: build, shell and doctor with the container driver, and clean with every driver except firecracker and hyperv (so also warden clean --driver qemu and --driver vz, which run the runtime today); --runtime and WARDEN_CTR_CLI replace it without an error, so a repository whose file is refused can be built without editing it; K1 can keep this unchanged, but for clean under qemu and vz, which K1 stops running the runtime'
    answer: 'Changed, in Jeff''s words: ''Throughout the project, there should be a general rule that configuration checking should be validated by the consumer/user of that configuration on initialization after applying overrides like environment variables. This is only enforced/required for all of the software components within the buildwarden organization and highly recommended for those extending or writing their own components, but isn''t enforced programmatically. But since it is likely that the same warden.toml may have all of the configuration for multiple driver implementations where there is a loop running warden builds for different operating systems/architectures configured through CLI (not unlike its own cross-platform build), then it is reasonably lazily validated to only the configurations for the specific driver(s) actually used for a specific run. In other words, it should allow for configuration sections/configurations that may not be used and so aren''t validated''. So: validation is the consumer''s, at its initialization, after overrides, and only for what the run uses; and this is a general project rule, to be written as one. Jeff, design review, 2026-11-15.'
  - id: a3
    kind: assumed
    status: confirmed
    question: The fix refuses a configuration that works today (a path, or a name other than finch, docker, podman, as [runtime] cli in a project's warden.toml). Does it take effect at once, with no release in which the old value still runs with a warning (UX-03)?
    options:
      - (a) refuse from the release that carries the fix; the refusal names the three ways out
      - (b) warn for one release, then refuse; the hole stays open for that release
    recommended: (a) refuse from the release that carries the fix; the refusal names the three ways out
    answer: 'Changed, in Jeff''s words: ''Use the logic that would be used for the warning to instead have a concrete error message about what needs to be changed/updated. This logic will eventually be removed like the warning would be''. So: an error at once, not a warning, with a concrete message saying what to change; the detection that produces that message is transitional and is removed later, as a deprecation warning would be. Jeff, design review, 2026-11-15.'
  - id: a4
    kind: assumed
    status: confirmed
    question: When is the transitional detection removed? It recognises the values that ran before this fix and are refused now (a supported runtime in another letter case or with .exe; a path to a supported runtime; nerdctl; a path to any other program) and gives each a message that says what to change. After its removal those values get the container driver's ordinary error, which lists finch, docker and podman.
    options:
      - '(a) it is in the release that first carries the fix and in the two releases after it, and is removed from the third: the window driver-contract proposes for its deprecated key names (at least two releases), the only window the project has proposed so far; Publish files the removal as its own small item'
      - (b) the release that first carries the fix and the one after it
      - '(c) removed with the deprecated key name [runtime] cli, in the change that ends driver-contract''s window: one removal for the container driver''s whole transition, at a date that depends on that item'
      - (d) kept until 1.0
    recommended: '(a) it is in the release that first carries the fix and in the two releases after it, and is removed from the third: the window driver-contract proposes for its deprecated key names (at least two releases), the only window the project has proposed so far; Publish files the removal as its own small item'
    answer: (d) The transitional detection is kept until 1.0. Departs from the recommendation (removed after two more releases); folded into the design. Jeff, design review, 2026-11-15.
  - id: a5
    kind: assumed
    status: confirmed
    question: 'How do UX-08 as amended and main agree on the day this merges? The amended rule says a setting is validated by its consumer, after the overrides, and only when the run uses it. Four checks of file settings on main are made more widely: the TOML type of every key, [vm] build_link and [vm] dns (each as a config file loads, on every command and driver), and [vm] image_refresh_after and image_min_grace (on every build and shell, under drivers that do not read them). The umbrella''s Decision 18 has a rule change in the item that makes it true. Flags are a6.'
    options:
      - (a) the amended wording lists the four by name as checks that predate it; each stays until the change that moves it to its consumer, and this item moves none. driver-contract already makes two of them true (the type of the driver-owned keys, and the two image ages) and strikes them; [vm] build_link, [vm] dns and the type of warden's own keys are put to driver-contract's review, whose Decision 8 keeps warden checking the link and the resolvers as the files load
      - (b) as (a), but configuration-bugfixes moves [vm] build_link and [vm] dns (its finding F8 already reworks those two checks); it is on hold behind the freeze, so the two stay listed until the program ends
      - '(c) this item also moves [vm] build_link and [vm] dns to the VM-driver commands, after --build-link: the rule lists two checks fewer; the security fix changes two more keys for every VM driver, undoes what build-link-subnet (a10) and hyperv-relay-per-build-channel confirmed, and edits the lines driver-contract rewrites; the type check still has to be listed'
      - '(d) the wording lists nothing, and main is out of step with UX-08 until those checks move: the shape Decision 18 rejected'
    recommended: (a) the amended wording lists the four by name as checks that predate it; each stays until the change that moves it to its consumer, and this item moves none. driver-contract already makes two of them true (the type of the driver-owned keys, and the two image ages) and strikes them; [vm] build_link, [vm] dns and the type of warden's own keys are put to driver-contract's review, whose Decision 8 keeps warden checking the link and the resolvers as the files load
    answer: (a) UX-08's wording lists the four older checks and this item moves none. Jeff, design review, 2026-11-15.
  - id: a6
    kind: assumed
    status: confirmed
    question: 'Does "only what a run uses is validated" in UX-08 as amended reach flags? Jeff''s words are about one warden.toml that holds the settings of several drivers. A flag is given to one run, and main refuses a flag the run cannot use: --script, --image, --cpus, --memory, --keep-vms and --build-link without a VM driver; --network without hyperv; --guest-os with a value that is not linux or windows, under every driver; setup --slots without hyperv or firecracker; image prepare --update without vz. --runtime is the exception: under a driver that does not use it, it is accepted and ignored.'
    options:
      - '(a) no: the rule''s second paragraph covers settings in a config file or the environment, which serve several runs; for a flag it says only that a command may refuse, at startup, one its run cannot use; every flag check on main conforms, --runtime being ignored conforms too, and nothing on main changes'
      - '(b) yes: a flag the run does not use is not checked either; the flag checks above are then five more entries in the rule''s list of older checks, each until some change removes it, and in the end warden build --cpus 4 with the container driver is accepted and the flag ignored'
      - '(c) the opposite, as a requirement: a flag the run cannot use is always refused; --runtime under the VM drivers then does not conform on main, and this item or a later one has to refuse it, which breaks a command line that passes --runtime with every driver'
    recommended: '(a) no: the rule''s second paragraph covers settings in a config file or the environment, which serve several runs; for a flag it says only that a command may refuse, at startup, one its run cannot use; every flag check on main conforms, --runtime being ignored conforms too, and nothing on main changes'
    answer: '(a) No: the lazy rule covers file and environment settings; a command may refuse a flag its run cannot use. Jeff, design review, 2026-11-15.'
