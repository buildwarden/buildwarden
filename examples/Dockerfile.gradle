FROM gradle:8-jdk21

WORKDIR /app

# Initialize a basic Gradle project
RUN gradle init --type basic --dsl groovy

# Write a minimal build.gradle with one dependency
RUN printf 'plugins { id "java" }\nrepositories { mavenCentral() }\ndependencies { implementation "junit:junit:4.13.2" }\n' > build.gradle

# Resolve dependencies
RUN gradle dependencies --refresh-dependencies
