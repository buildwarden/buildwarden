version: 2
project_name: buildwarden
before:
  hooks:
    - sh -c >
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-io-linux-amd64 ./cmd/warden-io &&
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-io-linux-arm64 ./cmd/warden-io &&
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-io-darwin-arm64 ./cmd/warden-io &&
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-relay-linux-amd64 ./cmd/relay &&
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-relay-linux-arm64 ./cmd/relay &&
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/warden-relay-darwin-arm64 ./cmd/relay
builds:
  - id: warden
    main: ./cmd/warden
    binary: warden
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: linux
    ids: [warden]
    builds: [warden]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: dist/warden-io-linux-{{ .Arch }}
        dst: warden-io
        info:
          mode: 0755
      - src: dist/warden-relay-linux-{{ .Arch }}
        dst: warden-relay
        info:
          mode: 0755
      - src: dist/warden-io-darwin-arm64
        dst: warden-io-darwin-arm64
        info:
          mode: 0755
      - src: dist/warden-relay-darwin-arm64
        dst: warden-relay-darwin-arm64
        info:
          mode: 0755
checksum:
  name_template: checksums.txt
  algorithm: sha256
signs:
  - cmd: cosign
    artifacts: checksum
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - ${artifact}
changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^ci"
release:
  github:
    owner: buildwarden
    name: buildwarden
