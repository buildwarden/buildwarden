# The Go relay in vm mode, as make conformance builds it into
# dist/conformance/relay (docs/design/seam-specs.md, The harness). Its build
# link is a kernel interface the sandbox creates in the relay's network
# namespace. A program path is relative to this file's directory.
role = "relay"
os = ["linux"]
launcher = "exec"

[exec]
argv = ["../../../dist/conformance/relay", "-mode", "vm", "-claim-addr", "{claim}"]
env = { WARDEN_CLAIM_TOKEN = "{token}" }

[relay]
mode = "vm"
link = "ip"
# Outside the ranges the sandbox addresses itself from (the documentation
# ranges, 100.64.0.0/24 and 10.0.2.0/24).
build_link = { prefix = "10.100.0.0/30", relay = "10.100.0.1", guest = "10.100.0.2" }
