name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # The container driver's namespace holder and iptables sidecar. Their digests
  # are compiled into warden, which runs exactly these images (never a tag).
  support-images:
    runs-on: ubuntu-latest
    outputs:
      holder: ${{ steps.holder.outputs.digest }}
      netns: ${{ steps.netns.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build warden-pause
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w" \
              -o images/warden-pause-$arch ./cmd/warden-pause
          done
          cp driver/container/images/*.Containerfile images/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: holder
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/holder.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/buildwarden/holder:${{ github.ref_name }}
      - id: netns
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/netns.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/buildwarden/netns:${{ github.ref_name }}

  # The release gate's deterministic half (LINT-03): tier 1 over everything
  # since the previous release, and the front-matter of every design.
  tier1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # golangci-lint reads this toolchain's export data
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - run: go build -o ../../dist/tier1 ./cmd/tier1
        working-directory: tools/tier1
      - name: tier1 against the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^")
          ./dist/tier1 -base "$prev"
      - run: ./dist/tier1 designs -all

  release:
    needs: [support-images, tier1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOLDER_IMAGE: ghcr.io/buildwarden/holder@${{ needs.support-images.outputs.holder }}
          NETNS_IMAGE: ghcr.io/buildwarden/netns@${{ needs.support-images.outputs.netns }}
