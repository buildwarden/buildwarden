name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: adding or removing `no-design` reruns tier 1 (FLOW-01).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Classifies a PR's changed paths so that docs-only PRs skip the Go jobs
  # (design ci-path-filters). Fail-open: every output is true unless each path
  # was positively classified, and on every non-PR event.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      gotests: ${{ steps.classify.outputs.gotests }}
      book: ${{ steps.classify.outputs.book }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        # A PR checks out GitHub's merge commit, so HEAD^1..HEAD is the PR's
        # change against the current base. --no-renames lists both sides of a
        # rename, so moving code into docs/ still counts as code.
        run: |
          all() { printf 'code=true\ngotests=true\nbook=true\n' >> "$GITHUB_OUTPUT"; }
          [ "$EVENT" = pull_request ] || { all; exit 0; }
          files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ] || { all; exit 0; }
          code=false rules=false book=false
          while IFS= read -r p; do
            case "$p" in
              # TestRealIndex (tools/tier1/rules) parses the real rule files.
              docs/development/*) rules=true ;;
              docs/book/*) book=true ;;
              docs/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          gotests=$code
          if [ "$rules" = true ]; then gotests=true; fi
          printf 'code=%s\ngotests=%s\nbook=%s\n' "$code" "$gotests" "$book" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # golangci-lint reads this toolchain's export data
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - run: golangci-lint run
      - run: golangci-lint run -c ../../.golangci.yml
        working-directory: tools/workflow
      - run: golangci-lint run -c ../../.golangci.yml
        working-directory: tools/tier1

  # Tier-1 static checks over the PR's diff, or a push's (LINT-02, LINT-04).
  tier1:
    # Runs on every PR; it needs changes only so a failed classifier shows once.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # golangci-lint reads this toolchain's export data
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - run: go build -o ../../dist/tier1 ./cmd/tier1
        working-directory: tools/tier1
      - name: tier1
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # FLOW-01 is judged on the PR, where the no-design label lives. A push
          # to main spans merged PRs that already passed it, and its payload
          # carries no labels, so it is not judged again there.
          FLAGS: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'no-design')) && '-no-design' || '' }}
        run: |
          ./dist/tier1 -base "$BASE" -json $FLAGS > tier1.json || code=$?
          ./dist/tier1 -base "$BASE" $FLAGS || true
          exit "${code:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier1-report
          path: tier1.json

  # tools/tier1 compares git paths, which must work on every platform (GLOBAL-07).
  tier1-test:
    needs: changes
    if: needs.changes.outputs.gotests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
        working-directory: tools/tier1

  test:
    needs: changes
    if: needs.changes.outputs.gotests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make test

  tidy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - run: go mod tidy && git diff --exit-code go.mod go.sum
        working-directory: tools/tier1

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - run: ./dist/warden --help

  # Build-only: docs.yml deploys from main and holds pages: write, so PRs build
  # the book here instead (design ci-path-filters, Decision 7).
  book:
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          mv mdbook /usr/local/bin/

      - name: Build docs
        run: mdbook build docs/book
