  - id: qemu-linux-exclusive-trust
    host: macos-qemu
    what: A qemu Linux guest with exclusive trust.
    design: docs/design/unified-bootstrap.md
    note: >-
      2026-10-29 (host:macos-qemu/20261029T201335Z, unattended, main 137feae,
      qemu-system-aarch64 from Homebrew, alpine_3_21.qcow2): partial pass.
      Exclusive trust holds: /etc/ssl/certs/ca-certificates.crt holds 1 cert,
      /bootstrap fetched over the relay, COPY of a file and a directory recorded
      (CONTEXT GET /one.txt, /sub/two.txt), egress to 1.1.1.1:8080 blocked, 14
      signatures valid. Not shown: the Java/Maven case (ubuntu:24.04) and any
      HTTPS fetch, because guest DNS failed. The relay forwards to qemu
      user-mode DNS 10.0.2.3:53 and times out ("DNS forward error ... i/o
      timeout"), likely the unattended session's sandbox blocking qemu's raw
      UDP to the host resolver (host HTTP through the proxy worked). Rerun
      attended outside the sandbox. Logs: native/macos-qemu/2026-10-29/.
      Side finding: the build reported SUCCEEDED although RUN "wget ... && echo"
      and RUN "apk add jq" failed (driver/script/translate.go joins RUNs under
      one set -e, so a failure inside an && list does not stop the build);
      proposed fix item in the 2026-10-29 digest.
    status: done
    done: 2026-10-30
    evidence: >-
      host:macos-qemu/20261030T172645Z, unattended, QEMU 11.1.1 (Homebrew),
      main 384b6ce and feat/container-inputs ddd11fe, both with the cached
      alpine_3_21.qcow2 and ubuntu_24_04.qcow2. Guest DNS now works from the
      unattended session. alpine:3.21 `apk add jq` over HTTPS through the relay:
      SUCCEEDED, 4 dl-cdn GETs recorded, `inspect --verify-disks` 26 signatures
      valid, all channels closed. ubuntu:24.04 Java/Maven (apt `maven`, which
      pulls openjdk-21-jre-headless): MAVEN_OPTS=-Djavax.net.ssl.trustStore=/etc/warden/certs.jks,
      `mvn dependency:get junit:junit:4.13.2` fetched over HTTPS from
      repo.maven.apache.org through the relay, 2678 signatures valid, all
      channels closed, ENVIRONMENT vm-disk-chain/v1 verified. Same results on
      the branch, which also wrote inputs/Containerfile and inputs/build.sh. One
      branch alpine run failed once on a transient "temporary error" fetching
      the main APKINDEX and passed on rerun. Also seen: the prepared
      ubuntu_24_04 guest root is 2.4G, so maven plus openjdk-21-jdk-headless
      fails with ENOSPC (the 2026-10-29 Dockerfile), and `warden build` /
      `image prepare` have no disk-size option. A non-prepared base
      (maven:3.9-eclipse-temurin-21) needs the build-vm kernel/initramfs, which
      this checkout does not build. Logs: native/macos-qemu/2026-10-30/.
