  - id: qemu-environment-descriptors
    host: qemu-any
    what: The qemu environment descriptors.
    design: docs/design/ledger-environment-types.md
    note: >-
      2026-10-30 (host:windows-hyperv/20261030T173857Z, attended, main
      384b6ce, QEMU 11.1.0 for Windows): not run. The qemu driver cannot run
      on an x86_64 host: startRelayVM and the build VM pass `-machine virt`,
      which qemu-system-x86_64 lacks (q35/pc/microvm only), and
      tools/relay-vm/build-initramfs.sh builds only an aarch64 relay, so
      `warden doctor --driver qemu` fails on missing relay assets. WHPX
      accel and `-chardev stdio` work in this QEMU. Needs either qemu-any
      moved to the macbook in hosts.yaml or x86_64 support in the qemu
      driver (proposed to Jeff).
      2026-10-31 (host:qemu-any/20261031T114004Z, unattended, macbook, main
      cc6119e, QEMU 11.1.1, relay initramfs from main). Linux half passes:
      alpine_3_21.qcow2 build of `apk add jq` SUCCEEDED; `inspect
      --verify-disks` vm-disk-chain/v1 payload verified, qemu linux/arm64,
      disk sha256:ebaef97d702d `local` [ok], 5 seed files, 23 signatures
      valid, all channels closed; an environment.json edited after the build
      is rejected ("payload MISMATCH", exit 1). Waiting branches: only
      feat/container-inputs touches driver/, at ddd11fe, verified the same way
      by the attended host:qemu-any/20261031T023128Z run (its branch binary
      cannot run under the native allowlist). Windows half (the design's "where
      prepared") fails: main's build on the cached windows-arm64.qcow2 times
      out with a silent guest, ledger holding only the ENVIRONMENT record
      (whose descriptor is well formed: disk + nvram, source `prepared`). Kept
      open on the Windows half, which waits on re-preparing the base
      (qemu-windows-guest-package). Logs: native/qemu-any/2026-10-31/.
      2026-10-31 attended: a base freshly re-prepared from the ISO (with PR
      #73) fails the same way, so the Windows half waits on a fix to the
      qemu Windows build guest, not just on re-preparing.
    status: open
